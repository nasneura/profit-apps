<style>
  :root{
    --ink:#171721;
    --ink-soft:#0F0F17;
    --paper:#0F0F17;
    --paper-dim:#1F1F2E;
    --stripe:#262436;
    --line:#26243A;
    --teal:#6FCF97;
    --teal-soft:rgba(111,207,151,0.14);
    --rust:#E2807A;
    --rust-soft:rgba(226,128,122,0.14);
    --gold:#5266EB;
    --gold-soft:rgba(82,102,235,0.14);
    --green:#6FCF97;
    --green-soft:rgba(111,207,151,0.14);
    --navy-light:#1F1F2E;
    --grey:#6E6C82;
    --text:#F2F0EA;
    --panel:#1F1F2E;
    --panel-alt:#262436;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Lexend',sans-serif;
    min-height:100vh;
  }
  .app{ display:flex; min-height:100vh; }

  /* ===== Sidebar ===== */
  .sidebar{
    width:260px;
    flex-shrink:0;
    height:100vh;
    position:sticky;
    top:0;
    background:var(--ink);
    color:var(--text);
    padding:28px 20px;
    display:flex;
    flex-direction:column;
  }
  .sidebar-scroll{
    flex:1;
    min-height:0;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:24px;
  }
  .brand{
    font-family:'Lexend',sans-serif; font-weight:700;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.01em;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .mark{ color:var(--gold); font-size:26px; }
  .brand-sub{ font-size:11px; color:#6E6C82; letter-spacing:0.08em; text-transform:uppercase; margin-top:2px; }

  .nav-section-label{

  .project-list{ display:flex; flex-direction:column; gap:2px; }
  .project-item{
    padding:9px 12px; border-radius:10px; cursor:pointer; font-size:13px;

  .project-item:hover{ background:rgba(255,255,255,0.05); }
  .project-item.active{ background:var(--panel-alt); color:var(--text); }
  .project-item.consolidated{ font-weight:600; }

  .btn-new-project{
    margin-top:6px; font-size:13px; color:var(--gold); background:none; border:1px dashed #3A3850;
    padding:8px 10px; border-radius:4px; cursor:pointer; text-align:left; font-family:inherit;
  }
  .btn-new-project:hover{ border-color:var(--gold); }

  .sidebar-footer{ margin-top:auto; border-top:1px solid #26243A; padding-top:16px; font-size:12px; color:#6E6C82; }
  .user-row{ display:flex; justify-content:space-between; align-items:center; }
  .role-badge{
    font-size:10px; text-transform:uppercase; letter-spacing:0.05em; padding:2px 6px; border-radius:3px;

  /* ===== Main ===== */
  .main{ flex:1; background:var(--paper); border-radius:18px 0 0 18px; padding:36px 44px; overflow-y:auto; }
  .main-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px; }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:24px; }

    padding:10px 16px; font-size:13px; font-weight:500; color:var(--grey); cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-1px;

  .tab.active{ color:var(--teal); border-bottom-color:var(--teal); font-weight:600; }

  .btn{
    font-family:'Lexend',sans-serif; font-size:13px; font-weight:600; padding:14px 24px 14px 26px; border-radius:0 32px 32px 0;
    border:none; background:var(--gold); color:#fff; cursor:pointer;

  .btn.secondary{ background:var(--panel-alt); color:var(--text); border:none; }

  .card{ background:var(--panel); border:none; border-radius:12px; padding:22px 24px; margin-bottom:20px; }

  input[type=text], input[type=email], input[type=password], input[type=number], select, textarea{
    font-family:'Lexend',sans-serif; font-size:14px; padding:9px 11px; border:1px solid var(--line);

  .field{ margin-bottom:14px; }
  .field-row{ display:flex; gap:14px; }
  .field-row > .field{ flex:1; }

  /* Summary stat cards */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
  .stat-card{ background:var(--panel); border:none; border-radius:12px; padding:16px 18px; }
  .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grey); margin-bottom:6px; }
  .stat-value{ font-family:'Lexend',sans-serif; font-variant-numeric:tabular-nums; font-size:22px; font-weight:600; }
  .stat-value.pos{ color:var(--teal); }
  .stat-value.neg{ color:var(--rust); }

  /* Ledger table */
  table.ledger{ width:100%; border-collapse:collapse; font-size:13.5px; border-radius:12px; overflow:hidden; }
  table.ledger thead tr{ background:transparent; }

    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--grey);

  table.ledger tr.group-row td{ background:var(--navy-light); font-weight:700; font-family:'Lexend',sans-serif; }

  .amt-neg{ color:var(--rust); }
  .grid-cell-input{
    width:100%; text-align:right; font-family:'Lexend',sans-serif; font-variant-numeric:tabular-nums; font-size:12.5px;

  .grid-cell-input:focus{ border-color:var(--gold); background:var(--panel-alt); outline:none; }
  .fc-cell{ opacity:0.35; font-style:italic; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--grey); }

  .upload-list{ display:flex; flex-direction:column; gap:8px; }
  .upload-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--paper-dim); border-radius:5px; font-size:13px; }
  .upload-meta{ color:var(--grey); font-size:12px; }
  .pill{ font-size:11px; letter-spacing:0.01em; padding:3px 10px; border-radius:999px; font-weight:600; }
  .pill.pnl{ background:var(--teal-soft); color:var(--teal); }
  .pill.cashflow{ background:var(--gold-soft); color:#B8C0FF; }
  .pill.forecast{ background:rgba(148,112,196,0.18); color:#C4A8E8; font-size:9px; padding:1px 6px; }

  .mapping-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; align-items:end; padding:10px 0; border-bottom:1px solid var(--paper-dim); }
  .mapping-preview{ font-size:12px; color:var(--grey); font-family:'Lexend',sans-serif; font-variant-numeric:tabular-nums; }

  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--ink); }
  .auth-card{ background:var(--paper); border-radius:12px; padding:40px 36px; width:380px; }
  .auth-title{ font-family:'Lexend',sans-serif; font-weight:700; font-size:26px; margin:0 0 4px 0; }
  .auth-sub{ color:var(--grey); font-size:13px; margin-bottom:24px; }
  .auth-toggle{ font-size:13px; color:var(--teal); cursor:pointer; margin-top:14px; text-align:center; }
  .error-msg{ background:var(--rust-soft); color:var(--rust); padding:9px 12px; border-radius:5px; font-size:12.5px; margin-bottom:14px; }
  .pw-field{ position:relative; }
  .pw-field input{ padding-right:38px; }
  .pw-toggle{
    position:absolute; right:1px; top:1px; bottom:1px; width:36px;
    background:none; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--grey); padding:0;
  }
  .pw-toggle:hover{ color:var(--text); }
  .pw-toggle svg{ width:18px; height:18px; }
  .info-msg{ background:var(--teal-soft); color:var(--teal); padding:9px 12px; border-radius:5px; font-size:12.5px; margin-bottom:14px; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(28,35,33,0.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal{ background:var(--panel); border:1px solid rgba(255,255,255,0.14); border-radius:14px; padding:26px 28px; width:420px; max-height:85vh; overflow-y:auto; }
  .modal-title{ font-family:'Lexend',sans-serif; font-weight:700; font-size:19px; margin:0 0 16px 0; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }

  .file-drop{ border:1.5px dashed var(--line); border-radius:7px; padding:26px; text-align:center; color:var(--grey); font-size:13px; cursor:pointer; }
  .template-link-card{ display:block; text-decoration:none; border:1.5px solid; border-radius:7px; padding:10px 12px; transition:transform 0.1s, box-shadow 0.15s; }
  .template-link-card:hover{ transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .file-drop:hover{ border-color:var(--teal); }
  .file-drop.has-file{ border-color:var(--teal); color:var(--teal); }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:#3A3850; border-radius:4px; }
</style>

<body>

<div id="root"></div>

<script>
const SUPABASE_URL = "https://zgewkcvgseonddybfckb.supabase.co";
const SUPABASE_KEY = "sb_publishable_A489kIupbSJiwmoGfgD6PA_W01ZMXjn";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  session: null,
  profile: null,
  projects: [],
  selectedProjectId: null, // null = not chosen, 'consolidated' = consolidated view
  consolidatedTab: 'pnl', // 'pnl' | 'cashflow' | 'forecast' | 'analysis'
  activeTab: 'summary',
  lineItems: [],
  uploads: [],
  authMode: 'login',
  authError: '',
  authInfo: '',
  loading: true,
  showNewProjectModal: false,
  newProjectDraft: null,
  showEditProjectModal: false,
  editProjectData: { id: null, name: '', description: '', opening_balance: 0, client_name: '', location: '', contract_value: 0, sst_percent: 8, deposit_percent: 50, mos_percent: 20, tax_percent: 32, percent_complete: 0, start_date: '', end_date: '' },
  budgetItems: [],
  showBudgetItemModal: false,
  budgetItemModalData: { id: null, category: '', budget_amount: '' },
  showUploadModal: false,
  uploadStep: 1,
  uploadFile: null,
  uploadRawRows: [],
  uploadHeaderRowIndex: null,
  uploadTemplateDetected: false,
  uploadFileRows: [],
  uploadFileHeaders: [],
  uploadStatementType: 'pnl',
  uploadPeriodLabel: '',
  uploadExcludeKeywords: 'subtotal, balance, total',
  uploadMapping: { category: '', subcategory: '', amount: '', period: '' },
  charterFormData: null,
  showQuickEditModal: false,
  quickEditType: 'cashflow',
  quickEditCategory: '',
  quickEditSubcategory: '',
  quickEditYear: new Date().getFullYear(),
  showLineItemModal: false,
  lineItemModalMode: 'add',
  lineItemModalType: 'pnl',
  lineItemModalData: { id: null, category: '', subcategory: '', amount: '', period: '', status: 'actual' },
  periodFilter: 'all',
  viewMode: 'grid',
  confirmDialog: { show: false, title: '', message: '', confirmLabel: 'Confirm', danger: true, onConfirm: null },
  showQuickFillModal: false,
  quickFillType: 'pnl',
  quickFillDraft: null,
  draftRestoredBanner: false,
  showResetPasswordModal: false,
};

function render(){ App(); }

// ===== Draft auto-save (survives accidental page reloads, e.g. mobile tab discard) =====
function saveDraft(key, data){
  try { localStorage.setItem(key, JSON.stringify({ data, savedAt: Date.now() })); } catch(e){ /* storage unavailable — ignore */ }
}
function loadDraft(key){
  try {
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    // Ignore stale drafts older than 24h
    if(Date.now() - parsed.savedAt > 24*60*60*1000){ localStorage.removeItem(key); return null; }
    return parsed.data;
  } catch(e){ return null; }
}
function clearDraft(key){
  try { localStorage.removeItem(key); } catch(e){ /* ignore */ }
}

function askConfirm({ title, message, confirmLabel = 'Confirm', danger = true, onConfirm }){
  state.confirmDialog = { show: true, title, message, confirmLabel, danger, onConfirm };
  render();
}

function closeConfirmDialog(){
  state.confirmDialog = { show: false, title: '', message: '', confirmLabel: 'Confirm', danger: true, onConfirm: null };
}

function fmtMoney(n){
  const v = Number(n) || 0;
  const abs = Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return v < 0 ? `(RM ${abs})` : `RM ${abs}`;
}

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtPeriod(dateStr){
  if(!dateStr) return '—';
  const [y, m] = dateStr.split('-');
  return `${MONTH_NAMES[parseInt(m,10)-1]} ${y}`;
}

function getDistinctPeriods(items){
  const set = new Set();
  items.forEach(i => { if(i.period) set.add(i.period.slice(0,7)); }); // YYYY-MM
  return [...set].sort().reverse();
}

function currentMonthValue(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function sortCategoriesLogically(entries, amountIndex){
  // Sort by actual sign of the total (money-in first, money-out after),
  // then by magnitude descending within each group.
  return entries.sort((a, b) => {
    const rankA = a[amountIndex] >= 0 ? 0 : 1;
    const rankB = b[amountIndex] >= 0 ? 0 : 1;
    if(rankA !== rankB) return rankA - rankB;
    return Math.abs(b[amountIndex]) - Math.abs(a[amountIndex]);
  });
}

async function init(){
  // Attach the auth listener FIRST, before checking the current session — otherwise
  // events fired during the initial page load (e.g. PASSWORD_RECOVERY, when the user
  // arrives via a reset-password email link) can happen before we're listening,
  // and we'd silently miss them.
  sb.auth.onAuthStateChange(handleAuthStateChange);

  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  if(session){
    await loadProfileAndProjects();
    state.selectedProjectId = 'consolidated';
    await loadProjectData('consolidated');
    await restorePendingDrafts();
  }
  state.loading = false;
  render();
}

async function handleAuthStateChange(event, session){
    if(event === 'PASSWORD_RECOVERY'){
      state.session = session;
      state.showResetPasswordModal = true;
      render();
      return;
    }

    const wasLoggedOut = !state.session;
    const isNowLoggedOut = !session;

    // The person was logged in before AND is still logged in now — nothing meaningful
    // changed (this covers TOKEN_REFRESHED, INITIAL_SESSION, and any other event Supabase
    // fires when a browser tab regains focus and silently re-validates the session, e.g.
    // SIGNED_IN firing again for an already-active session). Just refresh the session
    // reference quietly, WITHOUT a full re-render — otherwise any in-progress, unsaved
    // form (Add/Edit line item, Quick Edit months, etc.) gets wiped every time the person
    // switches browser tabs and comes back.
    if(!wasLoggedOut && !isNowLoggedOut){
      state.session = session;
      return;
    }

    state.session = session;
    if(session){
      await loadProfileAndProjects();
      if(wasLoggedOut){
        state.selectedProjectId = 'consolidated';
        await loadProjectData('consolidated');
      }
    } else {
      state.profile = null;
      state.projects = [];
      state.selectedProjectId = null;
    }
    render();
}

async function restorePendingDrafts(){
  const liDraft = loadDraft('profit_draft_lineitem');
  if(liDraft && liDraft.selectedProjectId){
    if(liDraft.selectedProjectId !== state.selectedProjectId){
      state.selectedProjectId = liDraft.selectedProjectId;
      await loadProjectData(liDraft.selectedProjectId);
    }
    state.activeTab = liDraft.type === 'cashflow' ? 'cashflow' : 'pnl';
    state.viewMode = 'list';
    state.lineItemModalMode = liDraft.mode;
    state.lineItemModalType = liDraft.type;
    state.lineItemModalData = liDraft.data;
    state.showLineItemModal = true;
    state.draftRestoredBanner = true;
    return;
  }
  const qfDraft = loadDraft('profit_draft_quickfill');
  if(qfDraft && qfDraft.selectedProjectId){
    if(qfDraft.selectedProjectId !== state.selectedProjectId){
      state.selectedProjectId = qfDraft.selectedProjectId;
      await loadProjectData(qfDraft.selectedProjectId);
    }
    state.activeTab = qfDraft.type === 'cashflow' ? 'cashflow' : 'pnl';
    state.viewMode = 'list';
    state.quickFillType = qfDraft.type;
    state.quickFillDraft = qfDraft.data;
    state.showQuickFillModal = true;
    state.draftRestoredBanner = true;
    return;
  }
  const npDraft = loadDraft('profit_draft_newproject');
  if(npDraft){
    state.newProjectDraft = npDraft.data;
    state.showNewProjectModal = true;
    state.draftRestoredBanner = true;
    return;
  }
  const epDraft = loadDraft('profit_draft_editproject');
  if(epDraft){
    state.editProjectData = epDraft.data;
    state.showEditProjectModal = true;
    state.draftRestoredBanner = true;
  }
}

async function loadProfileAndProjects(){
  const { data: profile } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  state.profile = profile;
  const { data: projects } = await sb.from('projects').select('*').order('created_at', {ascending:true});
  state.projects = projects || [];
}

async function loadProjectData(projectId){
  if(projectId === 'consolidated'){
    const { data: items } = await sb.from('line_items').select('*, projects(name)');
    state.lineItems = items || [];
    state.uploads = [];
    const { data: budgetItems } = await sb.from('budget_items').select('*, projects(name)');
    state.budgetItems = budgetItems || [];
  } else {
    const { data: items } = await sb.from('line_items').select('*').eq('project_id', projectId);
    state.lineItems = items || [];
    const { data: uploads } = await sb.from('uploads').select('*, profiles(full_name,email)').eq('project_id', projectId).order('uploaded_at', {ascending:false});
    state.uploads = uploads || [];
    const { data: budgetItems } = await sb.from('budget_items').select('*').eq('project_id', projectId);
    state.budgetItems = budgetItems || [];
  }
}

async function selectProject(id){
  state.selectedProjectId = id;
  state.activeTab = 'summary';
  state.periodFilter = 'all';
  await loadProjectData(id);
  render();
  document.querySelector('.main')?.scrollTo(0, 0);
}

// ===== Auth actions =====
async function handleAuthSubmit(email, password, fullName){
  state.authError = '';
  state.authInfo = '';
  if(state.authMode === 'signup'){
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
    if(error){ state.authError = error.message; render(); return; }
    if(!data.session){
      state.authInfo = 'Account created! Please check your email to confirm before logging in.';
      render();
      return;
    }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ state.authError = error.message; render(); return; }
  }
}

async function handleSignOut(){
  await sb.auth.signOut();
  state.selectedProjectId = null;
  render();

// ===== Upload / file parsing =====
function handleFileSelect(file){
  state.uploadFile = file;
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext === 'csv'){
    Papa.parse(file, {
      header:false, skipEmptyLines:'greedy',
      complete: (res) => {
        state.uploadRawRows = res.data;
        proceedAfterParse();
      }
    });
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheetName = pickBestSheet(wb);
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:'', blankrows:false});
      state.uploadRawRows = rows;
      proceedAfterParse();
    };
    reader.readAsArrayBuffer(file);
  }
}

function pickBestSheet(wb){
  // Prefer a sheet matching the current statement type tab name (e.g. "PnL" or "Cashflow")
  const wanted = state.uploadStatementType === 'pnl' ? 'pnl' : 'cashflow';
  const match = wb.SheetNames.find(n => n.toLowerCase().replace(/[^a-z]/g,'') === wanted);
  return match || wb.SheetNames[0];
}

function looksLikeInstructionsSheet(rows){
  const sample = rows.slice(0, 3).map(r => String(r[0] || '').toLowerCase()).join(' ');
  return sample.includes('how to use this template');
}

function proceedAfterParse(){
  const rows = state.uploadRawRows;

  // Check matrix/monthly template first (Type | Category | ...months... | Total)
  const matrixIdx = rows.slice(0, 10).findIndex(row => isMatrixTemplateFormat(row));
  if(matrixIdx !== -1){
    const headerRow = rows[matrixIdx];
    const dataRows = rows.slice(matrixIdx + 1).filter(row => row.some(c => c !== undefined && String(c).trim() !== ''));
    state.uploadFileHeaders = ['Category','Subcategory','Amount','Period'];
    state.uploadFileRows = transformMatrixRows(headerRow, dataRows);
    state.uploadMapping = { category: 'Category', subcategory: 'Subcategory', amount: 'Amount', period: 'Period' };
    state.uploadTemplateDetected = true;
    state.uploadStep = 3;
    render();
    return;
  }

  // Check flat template (Category | Subcategory | Month | Amount)
  const templateRowIdx = rows.slice(0, 10).findIndex(row => isTemplateFormat(row));
  if(templateRowIdx !== -1){
    state.uploadHeaderRowIndex = templateRowIdx;
    buildHeadersAndRows();
    state.uploadMapping = { category: state.uploadFileHeaders[0], subcategory: state.uploadFileHeaders[1], period: state.uploadFileHeaders[2], amount: state.uploadFileHeaders[3] };
    state.uploadTemplateDetected = true;
    state.uploadStep = 3;
    render();
    return;
  }

  // Neither template format matched — check if this is clearly the instructions tab
  if(looksLikeInstructionsSheet(rows)){
    alert('The file/tab being read looks like the "How To Use" (instructions) tab, not the PnL or Cashflow tab.\n\nPlease make sure:\n1. You upload the FULL .xlsx file (not a single-tab CSV)\n2. The selected "Statement type" (PnL/Cashflow) matches the tab that has data\n\nTry selecting the file again.');
    closeUploadModal();
    state.showUploadModal = true;
    render();
    return;
  }

  // Neither template format matched — guide the person to use the template instead
  // of silently guessing at an unknown format (safer than auto-detecting arbitrary layouts).
  state.uploadTemplateDetected = false;
  state.uploadStep = 'mismatch';
  render();
}

function guessHeaderRow(rows){
  let bestIdx = 0, bestScore = -1;
  rows.slice(0, 12).forEach((row, i) => {
    const nonEmpty = row.filter(c => c !== undefined && String(c).trim() !== '').length;
    if(nonEmpty > bestScore){ bestScore = nonEmpty; bestIdx = i; }
  });
  return bestIdx;
}

function makeHeadersUnique(rawHeaders){
  const counts = {};
  return rawHeaders.map((h, i) => {
    let name = (h === undefined || h === null || String(h).trim() === '') ? `Column ${i+1}` : String(h).trim();
    counts[name] = (counts[name] || 0) + 1;
    if(counts[name] > 1) name = `${name} (${counts[name]})`;
    return name;
  });
}

function buildHeadersAndRows(){
  const idx = state.uploadHeaderRowIndex;
  const rawHeaders = state.uploadRawRows[idx] || [];
  const headers = makeHeadersUnique(rawHeaders);
  const dataRows = state.uploadRawRows.slice(idx + 1)
    .filter(row => row.some(cell => cell !== undefined && String(cell).trim() !== ''));
  state.uploadFileHeaders = headers;
  state.uploadFileRows = dataRows.map(row => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = row[i]);
    return obj;
  });
  autoDetectMapping();
}

function isTemplateFormat(rawHeaders){
  const norm = rawHeaders.map(h => String(h || '').trim().toLowerCase());
  return norm[0] === 'category' && norm[1] === 'subcategory' && norm[2] === 'month' && norm[3] === 'amount';
}

function isMatrixTemplateFormat(rawHeaders){
  const norm = rawHeaders.map(h => String(h || '').trim().toLowerCase());
  return norm[0] === 'type' && norm[1] === 'category' && norm[norm.length - 1] === 'total';
}

function parseFlexibleMonth(label){
  const MONTH_MAP = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const s = String(label || '').trim().toLowerCase();
  const m = s.match(/^([a-z]{3,})/);
  if(!m) return null;
  const abbr = m[1].slice(0,3);
  if(!(abbr in MONTH_MAP)) return null;
  const yearMatch = s.match(/(\d{2,4})/);
  let year;
  if(yearMatch){
    year = yearMatch[1].length === 2 ? 2000 + parseInt(yearMatch[1],10) : parseInt(yearMatch[1],10);
  } else {
    year = new Date().getFullYear();
  }
  return `${year}-${String(MONTH_MAP[abbr]).padStart(2,'0')}`;
}

function transformMatrixRows(headerRow, dataRows){
  const headers = headerRow.map(h => String(h || '').trim());
  const monthCols = [];
  for(let i = 2; i < headers.length - 1; i++){
    const period = parseFlexibleMonth(headers[i]);
    if(period) monthCols.push({ idx: i, period });
  }
  const result = [];
  dataRows.forEach(row => {
    const type = String(row[0] || '').trim();
    const itemName = String(row[1] || '').trim();
    const t = type.toLowerCase();
    const isOutflow = /out|cogs|expense|cost|opex/.test(t);
    const isInflow = /in|revenue|income/.test(t);
    monthCols.forEach(({ idx, period }) => {
      const raw = row[idx];
      if(raw === undefined || raw === null || String(raw).trim() === '') return;
      let amount = parseFloat(String(raw).replace(/[^0-9.-]/g,'')) || 0;
      if(amount === 0) return;
      if(isOutflow && amount > 0) amount = -amount;
      if(isInflow && amount < 0) amount = Math.abs(amount);
      result.push({ Category: type, Subcategory: itemName, Amount: amount, Period: period });
    });
  });
  return result;
}

function autoDetectMapping(){
  const headers = state.uploadFileHeaders;
  const findMatch = (keywords) => headers.find(h => keywords.some(k => h.toLowerCase().includes(k))) || '';
  state.uploadMapping.category = findMatch(['activities','category','item','description','account']);
  state.uploadMapping.subcategory = findMatch(['subcategory','sub-category','detail']);
  state.uploadMapping.period = findMatch(['month','period','date']);
  state.uploadMapping.amount = findMatch(['total value','total price','amount','value','total']);
}

async function confirmUpload(){
  const { category, subcategory, amount, period } = state.uploadMapping;
  if(!category || !amount){ alert('Please map the Category and Amount columns.'); return; }
  if(!period){ alert('Please map the Month column — PROFIT requires a month on every line item.'); return; }

  const excludeList = state.uploadExcludeKeywords.split(',').map(k => k.trim().toLowerCase()).filter(Boolean);

  const { data: uploadRow, error: upErr } = await sb.from('uploads').insert({
    project_id: state.selectedProjectId,
    statement_type: state.uploadStatementType,
    file_name: state.uploadFile.name,
    period_label: state.uploadPeriodLabel || null,
    column_mapping: state.uploadMapping,
    uploaded_by: state.profile.id
  }).select().single();

  if(upErr){ alert(upErr.message); return; }

  const items = [];
  const skippedNoMonth = [];
  state.uploadFileRows.forEach(row => {
    const cat = String(row[category] || '').trim();
    if(!cat || excludeList.some(k => cat.toLowerCase().includes(k))) return;
    let periodVal = row[period];
    let periodDate = null;
    if(periodVal !== undefined && periodVal !== null && String(periodVal).trim() !== ''){
      const s = String(periodVal).trim();
      if(/^\d{4}-\d{2}(-\d{2})?$/.test(s)){
        periodDate = s.length === 7 ? `${s}-01` : s;
      } else {
        const parsed = parseFlexibleMonth(s);
        periodDate = parsed ? `${parsed}-01` : null;
      }
    }
    if(!periodDate){ skippedNoMonth.push(cat); return; }
    items.push({
      upload_id: uploadRow.id,
      project_id: state.selectedProjectId,
      statement_type: state.uploadStatementType,
      category: cat,
      subcategory: subcategory ? String(row[subcategory] || '').trim() : null,
      amount: parseFloat(String(row[amount]).replace(/[^0-9.-]/g,'')) || 0,
      period: periodDate,
    });
  });

  if(items.length === 0){
    alert(skippedNoMonth.length > 0
      ? `No rows imported — ${skippedNoMonth.length} row(s) had a Category but no valid Month value. Every row needs a recognizable month (e.g. "2026-01" or "Jan-26").`
      : 'No rows to import after filtering. Check your mapping or exclude keywords.');
    return;
  }

  const { error: itemErr } = await sb.from('line_items').insert(items);
  if(itemErr){ alert(itemErr.message); return; }

  if(skippedNoMonth.length > 0){
    alert(`Imported ${items.length} row(s). Skipped ${skippedNoMonth.length} row(s) with no valid Month value.`);
  }

  closeUploadModal();
  await loadProjectData(state.selectedProjectId);
  render();
}

function closeUploadModal(){
  state.showUploadModal = false;
  state.uploadStep = 1;
  state.uploadFile = null;
  state.uploadRawRows = [];
  state.uploadHeaderRowIndex = null;
  state.uploadTemplateDetected = false;
  state.uploadFileRows = [];
  state.uploadFileHeaders = [];
  state.uploadPeriodLabel = '';
  state.uploadExcludeKeywords = 'subtotal, balance, total';
  state.uploadMapping = { category:'', subcategory:'', amount:'', period:'' };
}

async function saveQuickEdit(monthValues){
  const { quickEditType, quickEditCategory, quickEditSubcategory } = state;
  const existing = state.lineItems.filter(i =>
    i.statement_type === quickEditType &&
    i.category === quickEditCategory &&
    (i.subcategory || '') === quickEditSubcategory
  );
  const byMonth = {};
  existing.forEach(i => { if(i.period) byMonth[i.period.slice(0,7)] = i; });

  const toInsert = [];
  const toUpdate = [];
  const toDelete = [];

  Object.entries(monthValues).forEach(([month, { amount, status }]) => {
    const existingRow = byMonth[month];
    if(amount === null){
      if(existingRow) toDelete.push(existingRow.id);
      return;
    }
    if(existingRow){
      toUpdate.push({ id: existingRow.id, amount, status });
    } else {
      toInsert.push({
        project_id: state.selectedProjectId,
        statement_type: quickEditType,
        category: quickEditCategory,
        subcategory: quickEditSubcategory || null,
        amount, period: `${month}-01`, status,
        created_by: state.profile.id,
      });
    }
  });

  if(toInsert.length === 0 && toUpdate.length === 0 && toDelete.length === 0){
    closeQuickEditModal();
    return;
  }

  if(toInsert.length > 0){
    const { error } = await sb.from('line_items').insert(toInsert);
    if(error){ alert(error.message); return; }
  }
  for(const u of toUpdate){
    const { error } = await sb.from('line_items').update({ amount: u.amount, status: u.status }).eq('id', u.id);
    if(error){ alert(error.message); return; }
  }
  if(toDelete.length > 0){
    const { error } = await sb.from('line_items').delete().in('id', toDelete);
    if(error){ alert(error.message); return; }
  }

  closeQuickEditModal();
  await loadProjectData(state.selectedProjectId);
  render();
}

async function submitQuickFill(items){
  if(items.length === 0){
    alert('Please enter an amount for at least one month.');
    return;
  }
  const { error } = await sb.from('line_items').insert(items);
  if(error){ alert(error.message); return; }
  clearDraft('profit_draft_quickfill');
  state.draftRestoredBanner = false;
  closeQuickFillModal();

  render();
}

  if(str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

}

function computeTotals(items){
  const pnl = items.filter(i=>i.statement_type==='pnl').reduce((s,i)=>s+Number(i.amount),0);
  const cf = items.filter(i=>i.statement_type==='cashflow').reduce((s,i)=>s+Number(i.amount),0);
  return { pnl, cf };
}

function sparklineSVG(values, color){
  if(!values || values.length < 2) return '';
  const w = 72, h = 18;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const points = values.map((v,i) => {
    const x = (i/(values.length-1)) * w;
    const y = h - ((v-min)/range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" style="margin-top:6px; display:block;"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}

function SummaryView(items, project){
  const { pnl, cf } = computeTotals(items);
  const wrap = el(`<div></div>`);
  const alerts = computeAlerts(project, state.lineItems, state.budgetItems || []);
  const criticalCount = alerts.filter(a => a.severity === 'critical').length;
  const warningCount = alerts.filter(a => a.severity === 'warning').length;
  const alertColor = criticalCount > 0 ? 'neg' : warningCount > 0 ? '' : 'pos';
  const alertHex = criticalCount > 0 ? 'var(--rust)' : warningCount > 0 ? 'var(--gold)' : 'var(--teal)';

  // ===== Precompute full-timeline monthly trends for sparklines =====
  const allPnlItems = state.lineItems.filter(i => i.statement_type === 'pnl' && i.period);
  const pnlByMonth = {};
  allPnlItems.forEach(i => { const m = i.period.slice(0,7); pnlByMonth[m] = (pnlByMonth[m]||0) + Number(i.amount); });
  const pnlTrend = Object.keys(pnlByMonth).sort().map(m => pnlByMonth[m]);

  const allCashItemsForTrend = state.lineItems.filter(i => i.statement_type === 'cashflow' && i.period);
  const cfByMonth = {};
  allCashItemsForTrend.forEach(i => { const m = i.period.slice(0,7); cfByMonth[m] = (cfByMonth[m]||0) + Number(i.amount); });
  const cfTrend = Object.keys(cfByMonth).sort().map(m => cfByMonth[m]);

  // ===== Project Details — quick glance at what was entered via Edit Project =====
  const hasDetails = project.client_name || project.location || project.contract_value > 0 || project.start_date || project.end_date || (project.percent_complete > 0);
  if(hasDetails){
    const detailItems = [];
    if(project.client_name) detailItems.push(['Client', esc(project.client_name)]);
    if(project.location) detailItems.push(['Location', esc(project.location)]);
    if(project.start_date || project.end_date) detailItems.push(['Timeline', `${project.start_date ? fmtPeriod(project.start_date) : '—'} → ${project.end_date ? fmtPeriod(project.end_date) : '—'}`]);
    if(project.contract_value > 0) detailItems.push(['Contract Value (excl. SST)', fmtMoney(project.contract_value)]);
    if(project.percent_complete > 0) detailItems.push(['% Complete', `${project.percent_complete}%`]);
    wrap.appendChild(el(`
      <div class="card" style="padding:15px 18px; margin-bottom:18px;">
        <div style="display:grid; grid-template-columns:repeat(${detailItems.length}, 1fr); gap:16px;">
          ${detailItems.map(([label, value]) => `
            <div>
              <div style="font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--grey); margin-bottom:3px;">${label}</div>
              <div style="font-size:13.5px; font-weight:500;">${value}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `));
  }

  wrap.appendChild(el(`
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Net PnL</div>
        <div class="stat-value ${pnl>=0?'pos':'neg'}">${fmtMoney(pnl)}</div>
        ${sparklineSVG(pnlTrend, pnl>=0?'var(--teal)':'var(--rust)')}
        <div style="font-size:10.5px;color:var(--grey);margin-top:5px;">Revenue minus Expenses (accounting profit) for the selected month</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Net Cashflow</div>
        <div class="stat-value ${cf>=0?'pos':'neg'}">${fmtMoney(cf)}</div>
        ${sparklineSVG(cfTrend, cf>=0?'var(--teal)':'var(--rust)')}
        <div style="font-size:10.5px;color:var(--grey);margin-top:5px;">Cash In minus Cash Out (actual money movement) for the selected month</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Open Alerts</div>
        <div class="stat-value" style="color:${alertHex};">${alerts.length === 0 ? 'All clear' : alerts.length}</div>
        <div style="font-size:10.5px;color:var(--grey);margin-top:5px;">${alerts.length === 0 ? 'No budget, cash, or margin issues detected' : `${criticalCount} critical, ${warningCount} warning — see Alerts tab`}</div>
      </div>
    </div>
  `));

  // ===== Executive cash flow summary — uses the FULL project timeline (not the period filter) =====
  const allCashItems = state.lineItems.filter(i => i.statement_type === 'cashflow');
  if(allCashItems.length > 0){
    const openingBalance = Number(project.opening_balance) || 0;
    const totalCashIn = allCashItems.filter(i => Number(i.amount) >= 0).reduce((s,i) => s + Number(i.amount), 0);
    const totalCashOut = allCashItems.filter(i => Number(i.amount) < 0).reduce((s,i) => s + Number(i.amount), 0);
    const netPosition = totalCashIn + totalCashOut;

    const dated = allCashItems.filter(i => i.period);
    const byMonth = {};
    dated.forEach(i => {
      const m = i.period.slice(0,7);
      byMonth[m] = (byMonth[m] || 0) + Number(i.amount);
    });
    const months = Object.keys(byMonth).sort();
    let running = openingBalance;
    let minBalance = openingBalance;
    const monthRows = months.map(m => {
      running += byMonth[m];
      if(running < minBalance) minBalance = running;
      return { month: m, net: byMonth[m], balance: running };
    });
    const endingBalance = months.length > 0 ? running : openingBalance + netPosition;

    // Per-month cash-in-only / cash-out-only trends (for the two split sparklines)
    const cashInByMonth = {}, cashOutByMonth = {};
    dated.forEach(i => {
      const m = i.period.slice(0,7);
      if(Number(i.amount) >= 0) cashInByMonth[m] = (cashInByMonth[m]||0) + Number(i.amount);
      else cashOutByMonth[m] = (cashOutByMonth[m]||0) + Number(i.amount);
    });
    const cashInTrend = months.map(m => cashInByMonth[m] || 0);
    const cashOutTrend = months.map(m => cashOutByMonth[m] || 0);
    const balanceTrend = monthRows.map(r => r.balance);

    wrap.appendChild(el(`
      <div class="page-sub" style="margin:-4px 0 10px;">The 5 cards below always reflect the <strong>full project timeline</strong> (Actual + Forecast combined) — independent of the month filter above.</div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Total Cash In</div>
          <div class="stat-value pos">${fmtMoney(totalCashIn)}</div>
          ${sparklineSVG(cashInTrend, 'var(--teal)')}
          <div style="font-size:10.5px;color:var(--grey);margin-top:5px;">All money coming in, whole project</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Cash Out</div>
          <div class="stat-value neg">${fmtMoney(totalCashOut)}</div>
          ${sparklineSVG(cashOutTrend, 'var(--rust)')}
          <div style="font-size:10.5px;color:var(--grey);margin-top:5px;">All money going out, whole project</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Net Cash Position</div>
          <div class="stat-value ${netPosition>=0?'pos':'neg'}">${fmtMoney(netPosition)}</div>
          ${sparklineSVG(monthRows.map(r=>r.net), netPosition>=0?'var(--teal)':'var(--rust)')}
          <div style="font-size:10.5px;color:var(--grey);margin-top:5px;">Cash In minus Cash Out, whole project</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Min. Balance</div>
          <div class="stat-value ${minBalance>=0?'pos':'neg'}">${fmtMoney(minBalance)}</div>
          ${sparklineSVG(balanceTrend, 'var(--gold)')}
          <div style="font-size:10.5px;color:var(--grey);margin-top:5px;">Lowest point the balance ever reaches, from Opening Balance across every month recorded</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Ending Cash Balance</div>
          <div class="stat-value ${endingBalance>=0?'pos':'neg'}">${fmtMoney(endingBalance)}</div>
          ${sparklineSVG(balanceTrend, endingBalance>=0?'var(--teal)':'var(--rust)')}
          <div style="font-size:10.5px;color:var(--grey);margin-top:5px;">Projected balance after the last month with data — not necessarily today</div>
        </div>
      </div>
    `));

    if(monthRows.length > 0){
      const monthCard = el(`
        <div class="card">
          <div class="card-title">Cash balance trend <span style="font-weight:400;font-size:12px;color:var(--grey);">— cumulative balance, month by month</span></div>
          ${chartCanvas(190)}
        </div>
      `);
      wrap.appendChild(monthCard);
      mountLineChart(
        monthCard.querySelector('canvas'), 'summary-balance-'+project.id,
        monthRows.map(r => fmtPeriod(r.month+'-01')), monthRows.map(r => r.balance)
      );

      const table = el(`
        <table class="ledger">
          <thead><tr><th>Month</th><th class="num">Net</th><th class="num">Cumulative Balance</th></tr></thead>
          <tbody>
            ${monthRows.map(r => `<tr><td class="cat">${fmtPeriod(r.month+'-01')}</td><td class="num ${r.net>=0?'amt-pos':'amt-neg'}">${fmtMoney(r.net)}</td><td class="num ${r.balance>=0?'amt-pos':'amt-neg'}" style="font-weight:600;">${fmtMoney(r.balance)}</td></tr>`).join('')}
          </tbody>
        </table>
      `);
      monthCard.appendChild(table);
    }

    // ===== Auto-generated Key Takeaways =====
    const takeaways = generateKeyTakeaways({
      project, totalCashIn, totalCashOut, netPosition, minBalance, endingBalance,
      openingBalance, monthRows, allCashItems,
    });
    if(takeaways.length > 0){
      const kCard = el(`<div class="card"><div class="card-title">Key Takeaways</div></div>`);
      const list = el(`<ul style="margin:0; padding-left:18px; font-size:13px; line-height:1.7; color:var(--text);"></ul>`);
      takeaways.forEach(t => list.appendChild(el(`<li>${t}</li>`)));
      kCard.appendChild(list);
      wrap.appendChild(kCard);
    }
  }

  if(items.length === 0){
    wrap.appendChild(el(`<div class="empty-state"><div class="big">No data yet</div><div>Upload a CSV/Excel file to get started.</div></div>`));
  } else {
    const c1 = CategoryBreakdown(items.filter(i=>i.statement_type==='pnl'), 'PnL — by category', 'summary-pnl-cat-'+project.id);
    const c2 = CategoryBreakdown(items.filter(i=>i.statement_type==='cashflow'), 'Cashflow — by category', 'summary-cf-cat-'+project.id);
    wrap.appendChild(c1);
    wrap.appendChild(c2);
  }
  return wrap;
}

function generateKeyTakeaways({ project, totalCashIn, totalCashOut, netPosition, minBalance, endingBalance, openingBalance, monthRows, allCashItems }){
  const takeaways = [];
  takeaways.push(`Total planned cash in for the project: ${fmtMoney(totalCashIn)}, against total planned cash out of ${fmtMoney(Math.abs(totalCashOut))}, for a net cash position of ${fmtMoney(netPosition)}.`);

  if(minBalance < 0){
    takeaways.push(`Minimum cash balance is projected to go <strong>negative</strong> (${fmtMoney(minBalance)}) — external cash injection or timing adjustment may be needed.`);
  } else {
    takeaways.push(`Minimum cash balance from project start is ${fmtMoney(minBalance)} — the balance never turns negative, so this project is expected to self-fund without external cash injection.`);
  }

  // Largest single outflow category
  const outflowByCategory = {};
  allCashItems.filter(i => Number(i.amount) < 0).forEach(i => {
    outflowByCategory[i.category] = (outflowByCategory[i.category] || 0) + Math.abs(Number(i.amount));
  });
  const sortedOutflows = Object.entries(outflowByCategory).sort((a,b) => b[1]-a[1]);
  if(sortedOutflows.length > 0){
    const [topCat, topAmt] = sortedOutflows[0];
    takeaways.push(`The largest single outflow category is <strong>${esc(topCat)}</strong> (~${fmtMoney(topAmt)}).`);
  }

  takeaways.push(`Ending cash balance: ${fmtMoney(endingBalance)}.`);

  // Budget/profitability reference, if budget data exists
  const budgetItems = state.budgetItems || [];
  if(budgetItems.length > 0 && Number(project.contract_value) > 0){
    const cogsTotal = budgetItems.reduce((s,b) => s + Number(b.budget_amount), 0);
    const totalProjectCost = cogsTotal;
    const grossProfit = Number(project.contract_value) - totalProjectCost;
    const taxAmount = grossProfit * (Number(project.tax_percent)||0) / 100;
    const netProfit = grossProfit - taxAmount;
    const margin = Number(project.contract_value) > 0 ? (netProfit / Number(project.contract_value) * 100) : 0;
    takeaways.push(`Against a contract value of ${fmtMoney(project.contract_value)}, projected net profit is ${fmtMoney(netProfit)} (${margin.toFixed(1)}% margin) — see Budget tab for the full breakdown.`);
  }

  return takeaways;
}

function CategoryBreakdown(items, title, chartId){
  const catGroups = {};
  items.forEach(i => {
    if(!catGroups[i.category]) catGroups[i.category] = {};
    const subKey = i.subcategory || '—';
    catGroups[i.category][subKey] = (catGroups[i.category][subKey] || 0) + Number(i.amount);
  });
  const catTotals = Object.entries(catGroups).map(([cat, subs]) => [cat, Object.values(subs).reduce((a,b)=>a+b,0), subs]);
  sortCategoriesLogically(catTotals, 1);
  const total = catTotals.reduce((s,[,amt])=>s+amt,0);

  const card = el(`<div class="card"><div class="card-title">${title}</div></div>`);
  if(catTotals.length === 0){
    card.appendChild(el(`<div style="color:var(--grey);font-size:13px;">No data.</div>`));
    return card;
  }

  if(chartId && catTotals.length > 1){
    const chartWrap = el(chartCanvas(Math.max(90, catTotals.length * 32)));
    card.appendChild(chartWrap);
    mountBarChart(
      chartWrap.querySelector('canvas'), chartId,
      catTotals.map(([cat]) => cat), catTotals.map(([,amt]) => amt),
      catTotals.map(([,amt]) => amt >= 0 ? '#6FCF97' : '#E2807A'), true
    );
  }

  let rowsHtml = '';
  catTotals.forEach(([cat, catAmt, subs]) => {
    const subEntries = Object.entries(subs);
    rowsHtml += `<tr class="group-row"><td class="cat">${esc(cat)}</td><td class="num">${fmtMoney(catAmt)}</td></tr>`;
    if(subEntries.length > 1 || subEntries[0][0] !== '—'){
      subEntries.sort((a,b) => b[1]-a[1]).forEach(([sub, amt]) => {
        rowsHtml += `<tr><td class="cat" style="padding-left:22px;font-size:12.5px;color:var(--grey);">${esc(sub)}</td><td class="num ${amt>=0?'amt-pos':'amt-neg'}" style="font-size:12.5px;">${fmtMoney(amt)}</td></tr>`;
      });
    }
  });
  rowsHtml += `<tr class="total-row"><td class="cat">Total</td><td class="num ${total>=0?'amt-pos':'amt-neg'}">${fmtMoney(total)}</td></tr>`;

  const table = el(`
    <table class="ledger">
      <thead><tr><th>Category</th><th class="num">Amount</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  `);
  card.appendChild(table);
  return card;
}

function buildMonthColumns(items){
  const set = new Set();
  items.forEach(i => { if(i.period) set.add(i.period.slice(0,7)); });
  return [...set].sort();
}

function MatrixGridView(items, type, project){
  const wrap = el(`<div></div>`);
  const months = buildMonthColumns(items);
  if(months.length === 0){
    const empty = el(`
      <div class="empty-state">
        <div class="big">No dated items to show in Grid view</div>
        <div>${items.length > 0 ? `You have ${items.length} item(s), but none have a Month set — Grid view needs a Month to build columns.` : 'Add line items with a Month set to see the grid view.'}</div>
        ${items.length > 0 ? `<button class="btn pill small" id="grid-switch-list-btn" style="margin-top:12px;">Switch to List view</button>` : ''}
      </div>
    `);
    const switchBtn = empty.querySelector('#grid-switch-list-btn');
    if(switchBtn) switchBtn.addEventListener('click', () => { state.viewMode = 'list'; render(); });
    wrap.appendChild(empty);
    return wrap;
  }
  const hasUndated = items.some(i => !i.period);
  const columns = hasUndated ? [...months, '__undated__'] : [...months];

  // catMap[cat][sub][colKey] = { sum, hasForecast }
  const catMap = {};
  items.forEach(i => {
    const cat = i.category;
    const sub = i.subcategory || '—';
    const colKey = i.period ? i.period.slice(0,7) : '__undated__';
    if(!catMap[cat]) catMap[cat] = {};
    if(!catMap[cat][sub]) catMap[cat][sub] = {};
    if(!catMap[cat][sub][colKey]) catMap[cat][sub][colKey] = { sum: 0, hasForecast: false };
    catMap[cat][sub][colKey].sum += Number(i.amount);
    if(i.status === 'forecast') catMap[cat][sub][colKey].hasForecast = true;
  });

  const catEntries = Object.entries(catMap).map(([cat, subs]) => {
    const total = Object.values(subs).reduce((s, m) => s + Object.values(m).reduce((a,c)=>a+c.sum,0), 0);
    return [cat, total, subs];
  });
  sortCategoriesLogically(catEntries, 1);

  const headerCells = columns.map(c => `<th class="num">${c === '__undated__' ? 'No Date' : fmtPeriod(c+'-01')}</th>`).join('');

  const grandTotalsByCol = {};
  const grandForecastByCol = {};
  columns.forEach(c => { grandTotalsByCol[c] = 0; grandForecastByCol[c] = false; });
  let grandTotal = 0;
  let bodyHtml = '';

  catEntries.forEach(([cat, catTotal, subs]) => {
    let catCells = '';
    columns.forEach(c => {
      let sum = 0;
      let catHasForecast = false;
      Object.values(subs).forEach(monthMap => {
        if(monthMap[c]){ sum += monthMap[c].sum; if(monthMap[c].hasForecast) catHasForecast = true; }
      });
      grandTotalsByCol[c] += sum;
      if(catHasForecast) grandForecastByCol[c] = true;
      catCells += `<td class="num${catHasForecast?' fc-cell':''}">${sum !== 0 ? fmtMoney(sum) : '—'}</td>`;
    });
    bodyHtml += `<tr class="group-row"><td class="cat">${esc(cat)}</td>${catCells}<td class="num">${fmtMoney(catTotal)}</td></tr>`;

    const subEntries = Object.entries(subs)
      .map(([sub, cellsByMonth]) => [sub, Object.values(cellsByMonth).reduce((a,c)=>a+c.sum,0), cellsByMonth])
      .sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]));
    const onlyDash = subEntries.length === 1 && subEntries[0][0] === '—';

    if(!onlyDash){
      subEntries.forEach(([sub, subTotal, cellsByMonth]) => {
        let cells = '';
        columns.forEach(c => {
          const cell = cellsByMonth[c];
          const sum = cell ? cell.sum : 0;
          const fcClass = cell && cell.hasForecast ? ' fc-cell' : '';
          cells += `<td class="num ${sum>=0?'amt-pos':'amt-neg'}${fcClass}" style="font-size:12.5px;">${sum !== 0 ? fmtMoney(sum) : '—'}</td>`;
        });
        bodyHtml += `<tr><td class="cat" style="padding-left:22px;font-size:12.5px;color:var(--grey);">${esc(sub)}</td>${cells}<td class="num" style="font-size:12.5px;">${fmtMoney(subTotal)}</td></tr>`;
      });
    }
    grandTotal += catTotal;
  });

  const totalRowCells = columns.map(c => `<td class="num ${grandTotalsByCol[c]>=0?'amt-pos':'amt-neg'}${grandForecastByCol[c]?' fc-cell':''}">${fmtMoney(grandTotalsByCol[c])}</td>`).join('');
  const totalRowLabel = type === 'cashflow' ? 'Net Cash Flow' : 'Grand total';
  bodyHtml += `<tr class="total-row"><td class="cat">${totalRowLabel}</td>${totalRowCells}<td class="num ${grandTotal>=0?'amt-pos':'amt-neg'}">${fmtMoney(grandTotal)}</td></tr>`;

  if(type === 'cashflow' && project){
    const openingBalance = Number(project.opening_balance) || 0;
    let running = openingBalance;
    const balanceByCol = {};
    months.forEach(m => {
      running += (grandTotalsByCol[m] || 0);
      balanceByCol[m] = running;
    });
    if(hasUndated) balanceByCol['__undated__'] = running; // undated items carried forward, not time-anchored
    const balanceCells = columns.map(c => `<td class="num ${balanceByCol[c]>=0?'amt-pos':'amt-neg'}${grandForecastByCol[c]?' fc-cell':''}" style="font-weight:700;">${fmtMoney(balanceByCol[c])}</td>`).join('');
    bodyHtml += `<tr class="total-row"><td class="cat">Cumulative Cash Balance</td>${balanceCells}<td class="num ${running>=0?'amt-pos':'amt-neg'}" style="font-weight:700;">${fmtMoney(running)}</td></tr>`;
  }

  const card = el(`
    <div class="card" style="overflow-x:auto;">
      <table class="ledger" style="min-width:${520 + columns.length*95}px;">
        <thead><tr><th>Category</th>${headerCells}<th class="num">Total</th></tr></thead>
        <tbody>${bodyHtml}</tbody>
      </table>
      <div style="font-size:11px;color:var(--grey);margin-top:10px;">Dimmed cells contain Forecast entries (not yet Actual).</div>
    </div>
  `);
  wrap.appendChild(card);
  return wrap;
}

  const revenue = items.filter(i => Number(i.amount) >= 0).reduce((s,i) => s + Number(i.amount), 0);
  const expenses = items.filter(i => Number(i.amount) < 0).reduce((s,i) => s + Math.abs(Number(i.amount)), 0);
  const profit = revenue - expenses;
  const margin = revenue > 0 ? (profit / revenue * 100) : 0;
  return el(`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value pos">${fmtMoney(revenue)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Expenses</div><div class="stat-value neg">${fmtMoney(expenses)}</div></div>
      <div class="stat-card"><div class="stat-label">Profit</div><div class="stat-value ${profit>=0?'pos':'neg'}">${fmtMoney(profit)}</div></div>
      <div class="stat-card"><div class="stat-label">Profit Margin</div><div class="stat-value ${margin>=0?'pos':'neg'}">${margin.toFixed(1)}%</div></div>
    </div>

}

function CashflowSummaryCards(items){

  const cashOut = items.filter(i => Number(i.amount) < 0).reduce((s,i) => s + Math.abs(Number(i.amount)), 0);

      rowsHtml += `<tr ${stripeOn ? 'style="background:var(--stripe);"' : ''}>

        <td class="cat">${esc(r.subcategory || '—')} ${r.status==='forecast' ? '<span class="pill forecast">Forecast</span>' : ''}</td>
