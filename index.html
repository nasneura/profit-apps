          <button class="btn pill small secondary row-delete" data-id="${r.id}" style="padding:3px 8px;font-size:11px;">Delete</button>
        </td>
      </tr>`;
    });
  });
  rowsHtml += `<tr class="total-row"><td class="cat" colspan="2">Grand total</td><td></td><td class="num ${grandTotal>=0?'amt-pos':'amt-neg'}">${fmtMoney(grandTotal)}</td><td></td></tr>`;

  const card = el(`
    <div class="card">
      <table class="ledger">
        <thead><tr><th style="width:24px;"></th><th>Subcategory</th><th>Month</th><th class="num">Amount</th><th style="width:120px;"></th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `);
  card.querySelectorAll('.row-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = state.lineItems.find(i => i.id === btn.dataset.id);
      if(item) openEditLineItem(item);
    });
  });
  card.querySelectorAll('.row-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = state.lineItems.find(i => i.id === btn.dataset.id);
      const label = item ? `${esc(item.category)}${item.subcategory ? ' — ' + esc(item.subcategory) : ''} (${fmtMoney(item.amount)})` : null;
      deleteLineItem(btn.dataset.id, label);
    });
  });
  wrap.appendChild(card);
  return wrap;
}

// ===== Rule-based Alerts (no paid AI — pure logic against known thresholds) =====
function computeAlerts(project, lineItems, budgetItems){
  const alerts = [];

  // 1. Budget over/near limit per category
  (budgetItems || []).forEach(b => {
    const actual = actualFor(b.category);
    const budget = Number(b.budget_amount);
    if(budget <= 0) return;
    const pct = (actual / budget) * 100;
    if(pct > 100){
      alerts.push({ severity: 'critical', title: `${esc(b.category)} is over budget`, detail: `${fmtMoney(actual)} spent against ${fmtMoney(budget)} budgeted (${pct.toFixed(0)}%).` });
    } else if(pct >= 85){
      alerts.push({ severity: 'warning', title: `${esc(b.category)} is near budget limit`, detail: `${fmtMoney(actual)} spent against ${fmtMoney(budget)} budgeted (${pct.toFixed(0)}%).` });
    }
  });

  // 2. Cash flow: min balance negative
  const cashItems = lineItems.filter(i => i.statement_type === 'cashflow' && i.period);
  if(cashItems.length > 0){
    const openingBalance = Number(project.opening_balance) || 0;
    const byMonth = {};
    cashItems.forEach(i => { const m = i.period.slice(0,7); byMonth[m] = (byMonth[m]||0) + Number(i.amount); });
    const months = Object.keys(byMonth).sort();
    let running = openingBalance, minBalance = openingBalance, minMonth = null;
    months.forEach(m => {
      running += byMonth[m];
      if(running < minBalance){ minBalance = running; minMonth = m; }
    });
    if(minBalance < 0){
      alerts.push({ severity: 'critical', title: 'Cash balance goes negative', detail: `Projected minimum balance is ${fmtMoney(minBalance)}${minMonth ? ' around ' + fmtPeriod(minMonth+'-01') : ''} — external funding or timing adjustment may be needed.` });
    } else if(minBalance < openingBalance * 0.1 && openingBalance > 0){
      alerts.push({ severity: 'warning', title: 'Cash balance runs very low', detail: `Projected minimum balance is ${fmtMoney(minBalance)}, close to zero relative to opening balance.` });
    }
  }

  // 3. Margin thin/negative (needs budget + contract value)
  if((budgetItems || []).length > 0 && Number(project.contract_value) > 0){
    const cogsTotal = budgetItems.reduce((s,b) => s + Number(b.budget_amount), 0);
    const grossProfit = Number(project.contract_value) - cogsTotal;
    const taxAmount = grossProfit * (Number(project.tax_percent)||0) / 100;
    const netProfit = grossProfit - taxAmount;
    const margin = Number(project.contract_value) > 0 ? (netProfit / Number(project.contract_value) * 100) : 0;
    if(margin < 0){
      alerts.push({ severity: 'critical', title: 'Project margin is negative', detail: `Projected net margin is ${margin.toFixed(1)}% — this project is forecast to lose money at current budget.` });
    } else if(margin < 10){
      alerts.push({ severity: 'warning', title: 'Project margin is thin', detail: `Projected net margin is only ${margin.toFixed(1)}% — limited buffer for cost overruns.` });
    }
  }

  // 4. Spend pace ahead of reported progress
  const pc = Number(project.percent_complete) || 0;
  if((budgetItems || []).length > 0 && pc > 0){
    const cogsTotal = budgetItems.reduce((s,b) => s + Number(b.budget_amount), 0);
    const totalActual = budgetItems.reduce((s,b) => s + actualFor(b.category), 0);
    const spendPct = cogsTotal > 0 ? (totalActual / cogsTotal) * 100 : 0;
    if(spendPct - pc > 20){
      alerts.push({ severity: 'warning', title: 'Spend is ahead of reported progress', detail: `${spendPct.toFixed(0)}% of budget spent, but project is only ${pc}% complete — cost may be running ahead of actual work done.` });
    }
  }

  const order = { critical: 0, warning: 1 };
  return alerts.sort((a,b) => order[a.severity] - order[b.severity]);
}

function actualFor(category){
  const catLower = category.trim().toLowerCase();
  return state.lineItems
    .filter(i => {
      if(i.statement_type !== 'pnl') return false; // Actual cost = accounting spend (PnL/Expenses), not cash timing
      const cat = (i.category || '').trim().toLowerCase();
      const sub = (i.subcategory || '').trim().toLowerCase();
      // Budget categories are set against the specific cost item (e.g. "Direct Manpower"),
      // which in uploaded/entered line items usually lives in Subcategory (Category holds the
      // top-level Revenue/Expenses grouping) — match either field so both data shapes work.
      return cat === catLower || sub === catLower;
    })
    .reduce((s,i) => s + Math.abs(Number(i.amount)), 0);
}

function BudgetView(project){
  const wrap = el(`<div></div>`);
  const isAdmin = state.profile && state.profile.role === 'admin';

  wrap.appendChild(el(`<div style="font-size:12.5px;color:var(--grey);margin-bottom:12px;">Looking for EAC/ETC/VAC/CPI or schedule performance? See the <strong>Performance Analysis</strong> tab.</div>`));

  // Budget category table
  const budgetItems = state.budgetItems || [];
  const cogsTotal = budgetItems.reduce((s,b) => s + Number(b.budget_amount), 0);

  const addBar = el(`
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div class="card-title" style="margin:0;">Budget by Category</div>
      ${isAdmin ? `<button class="btn pill small" id="add-budget-item-btn">+ Add budget line</button>` : ''}
    </div>
  `);
  if(isAdmin) addBar.querySelector('#add-budget-item-btn').addEventListener('click', openAddBudgetItem);

  const budgetCard = el(`<div class="card"></div>`);
  budgetCard.appendChild(addBar);

  if(budgetItems.length === 0){
    budgetCard.appendChild(el(`<div class="empty-state" style="padding:30px 0;"><div class="big">No budget lines yet</div><div>${isAdmin ? 'Click "+ Add budget line" to set your estimated cost per category.' : 'Ask an admin to set up the project budget.'}</div></div>`));
  } else {
    const chartWrap = el(chartCanvas(Math.max(160, budgetItems.length * 30)));
    budgetCard.appendChild(chartWrap);
    mountGroupedBarChart(chartWrap.querySelector('canvas'), 'budget-vs-actual-'+project.id,
      budgetItems.map(b => b.category), [
        { label: 'Budget', data: budgetItems.map(b => Number(b.budget_amount)), backgroundColor: '#5266EB', borderRadius: 4 },
        { label: 'Actual', data: budgetItems.map(b => actualFor(b.category)), backgroundColor: '#6FCF97', borderRadius: 4 },
      ]
    );

    const rowsHtml = budgetItems.map(b => {
      const actual = actualFor(b.category);
      const variance = Number(b.budget_amount) - actual;
      const budgetAmt = Number(b.budget_amount);
      const usagePct = budgetAmt > 0 ? (actual / budgetAmt * 100) : 0;
      const barPct = Math.min(100, usagePct);
      const barColor = usagePct > 100 ? 'var(--rust)' : usagePct >= 85 ? 'var(--gold)' : 'var(--teal)';
      return `<tr data-budget-id="${b.id}">
        <td class="cat">${esc(b.category)}</td>
        <td class="num">${isAdmin
          ? `<input type="number" step="0.01" class="grid-cell-input budget-amt-input" value="${b.budget_amount}" style="font-weight:600;">`
          : fmtMoney(b.budget_amount)}</td>
        <td class="num" style="color:var(--grey);">${fmtMoney(actual)}</td>
        <td style="min-width:120px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="flex:1; height:7px; background:var(--panel-alt); border-radius:4px; overflow:hidden;">
              <div style="width:${barPct}%; height:100%; background:${barColor};"></div>
            </div>
            <span style="font-size:11px; color:${barColor}; font-weight:600; min-width:36px; text-align:right;">${usagePct.toFixed(0)}%</span>
          </div>
        </td>
        <td class="num ${variance>=0?'amt-pos':'amt-neg'}">${fmtMoney(variance)}</td>
        ${isAdmin ? `<td style="white-space:nowrap;">
          <button class="btn pill small secondary budget-delete" data-id="${b.id}" style="padding:3px 8px;font-size:11px;">Delete</button>
        </td>` : ''}
      </tr>`;
    }).join('');
    const table = el(`
      <table class="ledger">
        <thead><tr><th>Category</th><th class="num">Budget</th><th class="num">Actual</th><th>Usage</th><th class="num">Variance</th>${isAdmin ? '<th></th>' : ''}</tr></thead>
        <tbody>
          ${rowsHtml}
          <tr class="group-row"><td class="cat">Subtotal — COGS <span style="font-weight:400;font-size:11px;color:var(--grey);">(Cost of Goods Sold)</span></td><td class="num">${fmtMoney(cogsTotal)}</td><td></td><td></td><td></td>${isAdmin?'<td></td>':''}</tr>
        </tbody>
      </table>
    `);
    table.querySelectorAll('.budget-amt-input').forEach(input => {
      input.addEventListener('change', () => {
        const id = input.closest('tr').dataset.budgetId;
        updateBudgetAmount(id, input.value);
      });
    });
    table.querySelectorAll('.budget-delete').forEach(btn => btn.addEventListener('click', () => {
      const item = budgetItems.find(b => b.id === btn.dataset.id);
      if(item) deleteBudgetItem(item.id, item.category);
    }));
    budgetCard.appendChild(table);
  }
  wrap.appendChild(budgetCard);

  // Cost & pricing rollup
  const sstPercent = Number(project.sst_percent) || 0;
  const depositPercent = Number(project.deposit_percent) || 0;
  const taxPercent = Number(project.tax_percent) || 0;
  const contractValue = Number(project.contract_value) || 0;

  const totalProjectCost = cogsTotal;
  const sstAmount = contractValue * sstPercent / 100;
  const totalContractValue = contractValue + sstAmount;
  const depositAmount = contractValue * depositPercent / 100;
  const grossProfit = contractValue - totalProjectCost;
  const taxAmount = grossProfit * taxPercent / 100;
  const netProfit = grossProfit - taxAmount;
  const margin = contractValue > 0 ? (netProfit / contractValue * 100) : 0;

  wrap.appendChild(el(`
    <div class="card">
      <div class="card-title">Total Project Cost</div>
      <table class="ledger">
        <tbody>
          <tr><td class="cat">Subtotal — COGS <span style="font-weight:400;font-size:11px;color:var(--grey);">(Cost of Goods Sold)</span></td><td class="num">${fmtMoney(cogsTotal)}</td></tr>
          <tr class="total-row"><td class="cat">Total Project Cost</td><td class="num">${fmtMoney(totalProjectCost)}</td></tr>
        </tbody>
      </table>
    </div>
  `));

  wrap.appendChild(el(`
    <div class="card">
      <div class="card-title">Pricing</div>
      <table class="ledger">
        <tbody>
          <tr><td class="cat">Contract Value (excl. SST)</td><td class="num">${fmtMoney(contractValue)}</td></tr>
          <tr><td class="cat">SST <span style="font-weight:400;font-size:11px;color:var(--grey);">(Sales &amp; Service Tax)</span> (${sstPercent}%)</td><td class="num">${fmtMoney(sstAmount)}</td></tr>
          <tr class="total-row"><td class="cat">Total Contract Value (incl. SST)</td><td class="num">${fmtMoney(totalContractValue)}</td></tr>
          <tr><td class="cat">Deposit Required (${depositPercent}%)</td><td class="num">${fmtMoney(depositAmount)}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-title">Profitability</div>
      <table class="ledger">
        <tbody>
          <tr><td class="cat">Gross Profit</td><td class="num ${grossProfit>=0?'amt-pos':'amt-neg'}">${fmtMoney(grossProfit)}</td></tr>
          <tr><td class="cat">Tax (${taxPercent}% of Gross Profit)</td><td class="num">${fmtMoney(taxAmount)}</td></tr>
          <tr class="total-row"><td class="cat">Net Profit</td><td class="num ${netProfit>=0?'amt-pos':'amt-neg'}">${fmtMoney(netProfit)} <span style="font-size:12px;font-weight:400;color:var(--grey);">(${margin.toFixed(1)}% margin)</span></td></tr>
        </tbody>
      </table>
    </div>
  `));

  return wrap;
}

function PerformanceView(project){
  const wrap = el(`<div></div>`);
  const budgetItems = state.budgetItems || [];
  const cogsTotal = budgetItems.reduce((s,b) => s + Number(b.budget_amount), 0);
  const totalActual = budgetItems.reduce((s,b) => s + actualFor(b.category), 0);
  const pc = Math.max(0, Math.min(100, Number(project.percent_complete) || 0));

  if(budgetItems.length === 0){
    wrap.appendChild(el(`<div class="empty-state"><div class="big">No budget set up yet</div><div>Add budget lines in the Budget tab first — Performance Analysis needs a budget baseline to compare against.</div></div>`));
    return wrap;
  }

  // ===== Cost Forecast: EAC / ETC / VAC / CPI =====
  const eac = pc > 0 ? totalActual / (pc / 100) : cogsTotal;
  const etc = Math.max(0, eac - totalActual);
  const vac = cogsTotal - eac;
  const ev = cogsTotal * (pc / 100);
  const cpi = pc > 0 && totalActual > 0 ? ev / totalActual : null;

  // ===== Schedule metrics (computed early — needed for Health Score too) =====
  const hasSchedule = project.start_date && project.end_date;
  let pv = null, sv = null, spi = null;
  if(hasSchedule){
    const start = new Date(project.start_date);
    const end = new Date(project.end_date);
    const today = new Date();
    const totalDuration = end - start;
    let elapsed = today - start;
    if(elapsed < 0) elapsed = 0;
    if(elapsed > totalDuration) elapsed = totalDuration;
    const timeElapsedPct = totalDuration > 0 ? (elapsed / totalDuration) * 100 : 0;
    pv = cogsTotal * (timeElapsedPct / 100);
    sv = ev - pv;
    spi = pv > 0 ? ev / pv : null;
  }

  // ===== Project Health Score — combines CPI, SPI, budget usage, and alerts into one glance =====
  const alerts = computeAlerts(project, state.lineItems, budgetItems);
  const criticalAlerts = alerts.filter(a => a.severity === 'critical').length;
  const warningAlerts = alerts.filter(a => a.severity === 'warning').length;
  const reasons = [];
  let healthLevel = 'good'; // good | watch | critical
  if(criticalAlerts > 0){ healthLevel = 'critical'; reasons.push(`${criticalAlerts} critical alert${criticalAlerts>1?'s':''}`); }
  if(cpi !== null && cpi < 0.9){ healthLevel = 'critical'; reasons.push('CPI below 0.9 (cost overrun)'); }
  if(spi !== null && spi < 0.9){ healthLevel = 'critical'; reasons.push('SPI below 0.9 (behind schedule)'); }
  if(healthLevel !== 'critical'){
    if(warningAlerts > 0){ healthLevel = 'watch'; reasons.push(`${warningAlerts} warning alert${warningAlerts>1?'s':''}`); }
    if(cpi !== null && cpi < 1){ healthLevel = 'watch'; reasons.push('CPI below 1.0'); }
    if(spi !== null && spi < 1){ healthLevel = 'watch'; reasons.push('SPI below 1.0'); }
  }
  const healthMeta = {
    good: { label: 'Healthy', color: '#6FCF97', bg: 'rgba(111,207,151,0.1)' },
    watch: { label: 'Needs Attention', color: '#D9A441', bg: 'rgba(217,164,65,0.1)' },
    critical: { label: 'Critical', color: '#E2807A', bg: 'rgba(226,128,122,0.1)' },
  }[healthLevel];
  wrap.appendChild(el(`
    <div class="card" style="padding:16px 20px; background:${healthMeta.bg}; box-shadow:inset 0 0 0 1px ${healthMeta.color}33; margin-bottom:14px;">
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <div style="width:14px; height:14px; border-radius:50%; background:${healthMeta.color}; flex-shrink:0;"></div>
        <div style="flex:1; min-width:200px;">
          <div style="font-size:15px; font-weight:700; color:${healthMeta.color};">${healthMeta.label}</div>
          <div style="font-size:11.5px; color:var(--grey); margin-top:2px;">${reasons.length > 0 ? reasons.join(' · ') : 'CPI, SPI, budget, and alerts all within healthy range.'}</div>
        </div>
        <div style="display:flex; gap:18px; font-size:11.5px; color:var(--grey);">
          <div>CPI <strong style="color:${cpi===null?'var(--text)':(cpi>=1?'#6FCF97':'#E2807A')};">${cpi===null?'—':cpi.toFixed(2)}</strong></div>
          <div>SPI <strong style="color:${spi===null?'var(--text)':(spi>=1?'#6FCF97':'#E2807A')};">${spi===null?'—':spi.toFixed(2)}</strong></div>
          <div>Alerts <strong style="color:var(--text);">${alerts.length}</strong></div>
        </div>
      </div>
    </div>
  `));

  wrap.appendChild(el(`
    <div class="card" style="padding:16px 18px;">
      <div class="card-title" style="font-size:12.5px; margin-bottom:10px;">Cost Forecast <span style="font-weight:400;font-size:11px;color:var(--grey);">— based on ${pc}% complete</span></div>
      <div class="stat-grid" style="gap:10px; margin-bottom:8px;">
        <div class="stat-card" style="padding:11px 13px;">
          <div class="stat-label" style="font-size:9.5px; margin-bottom:4px;">EAC — Estimate at Completion</div>
          <div class="stat-value" style="font-size:17px;">${fmtMoney(eac)}</div>
        </div>
        <div class="stat-card" style="padding:11px 13px;">
          <div class="stat-label" style="font-size:9.5px; margin-bottom:4px;">ETC — Estimate to Complete</div>
          <div class="stat-value" style="font-size:17px;">${fmtMoney(etc)}</div>
        </div>
        <div class="stat-card" style="padding:11px 13px;">
          <div class="stat-label" style="font-size:9.5px; margin-bottom:4px;">VAC — Variance at Completion</div>
          <div class="stat-value ${vac>=0?'pos':'neg'}" style="font-size:17px;">${fmtMoney(vac)}</div>
        </div>
        <div class="stat-card" style="padding:11px 13px;">
          <div class="stat-label" style="font-size:9.5px; margin-bottom:4px;">CPI — Cost Performance Index</div>
          <div class="stat-value ${cpi===null?'':(cpi>=1?'pos':'neg')}" style="font-size:17px;">${cpi===null ? '—' : cpi.toFixed(2)}</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--grey);">
        ${pc === 0 ? 'Set "% Complete" via Edit Project to activate forecasting — until then EAC defaults to Budget.' : `VAC ${vac>=0?'positive':'negative'} means the project is forecast to finish ${vac>=0?'under':'over'} budget. CPI ${cpi!==null && cpi>=1 ? '≥ 1.0 means cost-efficient so far.' : cpi!==null ? '< 1.0 means costs are running ahead of value earned.' : ''}`}
      </div>
    </div>
  `));

  wrap.appendChild(el(`
    <div class="card" style="padding:16px 18px;">
      <div class="card-title" style="font-size:12.5px; margin-bottom:10px;">Schedule Performance <span style="font-weight:400;font-size:11px;color:var(--grey);">(EVM — Earned Value Management)</span></div>
      ${!hasSchedule ? `<div style="font-size:12px;color:var(--grey);">Set Start date and End date via Edit Project to activate PV, SV, and SPI.</div>` : `
        <div class="stat-grid" style="gap:10px; margin-bottom:8px;">
          <div class="stat-card" style="padding:11px 13px;">
            <div class="stat-label" style="font-size:9.5px; margin-bottom:4px;">PV — Planned Value</div>
            <div class="stat-value" style="font-size:17px;">${fmtMoney(pv)}</div>
          </div>
          <div class="stat-card" style="padding:11px 13px;">
            <div class="stat-label" style="font-size:9.5px; margin-bottom:4px;">EV — Earned Value</div>
            <div class="stat-value" style="font-size:17px;">${fmtMoney(ev)}</div>
          </div>
          <div class="stat-card" style="padding:11px 13px;">
            <div class="stat-label" style="font-size:9.5px; margin-bottom:4px;">SV — Schedule Variance</div>
            <div class="stat-value ${sv>=0?'pos':'neg'}" style="font-size:17px;">${fmtMoney(sv)}</div>
          </div>
          <div class="stat-card" style="padding:11px 13px;">
            <div class="stat-label" style="font-size:9.5px; margin-bottom:4px;">SPI — Schedule Performance Index</div>
            <div class="stat-value ${spi===null?'':(spi>=1?'pos':'neg')}" style="font-size:17px;">${spi===null ? '—' : spi.toFixed(2)}</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--grey);">
          SV ${sv>=0?'positive':'negative'} means the project is ${sv>=0?'ahead of':'behind'} schedule in value terms. SPI ${spi!==null && spi>=1 ? '≥ 1.0 = ahead of schedule.' : spi!==null ? '< 1.0 = behind schedule.' : ''}
        </div>
      `}
    </div>
  `));

  // ===== S-Curve: Planned (Cumulative) vs Actual (Cumulative) cost over the project timeline =====
  let monthList = [], plannedCumulative = [], actualCumulative = [];
  if(hasSchedule){
    const startDate = new Date(project.start_date);
    const endDate = new Date(project.end_date);
    let cur = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
    const endMonth = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
    while(cur <= endMonth && monthList.length < 60){
      monthList.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`);
      cur.setMonth(cur.getMonth() + 1);
    }
    const totalMonths = monthList.length;
    plannedCumulative = monthList.map((m, idx) => cogsTotal * ((idx + 1) / totalMonths));

    const actualByMonth = {};
    state.lineItems.filter(i => i.statement_type === 'pnl' && i.period && Number(i.amount) < 0).forEach(i => {
      const m = i.period.slice(0,7);
      actualByMonth[m] = (actualByMonth[m] || 0) + Math.abs(Number(i.amount));
    });
    let runningActual = 0;
    const todayMonth = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
    actualCumulative = monthList.map(m => {
      if(m > todayMonth) return null;
      runningActual += (actualByMonth[m] || 0);
      return runningActual;
    });

    const lastActualIdx = actualCumulative.reduce((last, v, i) => v !== null ? i : last, -1);
    const aheadOrBehind = lastActualIdx >= 0 ? (actualCumulative[lastActualIdx] <= plannedCumulative[lastActualIdx] ? 'under' : 'over') : null;

    const sCurveCard = el(`
      <div class="card">
        <div class="card-title">S-Curve <span style="font-weight:400;font-size:12px;color:var(--grey);">— planned vs actual cumulative cost, spot drift early</span></div>
        ${chartCanvas(220)}
        ${aheadOrBehind ? `<div style="font-size:11.5px;color:var(--grey);margin-top:2px;">Actual spend is currently tracking <strong style="color:${aheadOrBehind==='under'?'#6FCF97':'#E2807A'};">${aheadOrBehind === 'under' ? 'under' : 'over'}</strong> the planned curve.</div>` : ''}
      </div>
    `);
    wrap.appendChild(sCurveCard);
    mountMultiLineChart(sCurveCard.querySelector('canvas'), 'scurve-'+project.id,
      monthList.map(m => fmtPeriod(m+'-01')),
      [
        { label: 'Planned (Cumulative)', data: plannedCumulative, color: '#5266EB', dashed: true },
        { label: 'Actual (Cumulative)', data: actualCumulative, color: aheadOrBehind === 'over' ? '#E2807A' : '#6FCF97', fill: true },
      ]
    );

    // ===== Cost Ratio Trend — Actual/Planned ratio each month (leading indicator; true CPI needs
    // historical % complete which PROFIT doesn't track over time, so this ratio is the closest
    // computable proxy — above 1.0 means spend is outpacing the plan) =====
    const ratioTrend = monthList.map((m, idx) => actualCumulative[idx] === null ? null : (plannedCumulative[idx] > 0 ? actualCumulative[idx] / plannedCumulative[idx] : null));
    const validRatios = ratioTrend.filter(v => v !== null);
    if(validRatios.length >= 2){
      const trendDirection = validRatios[validRatios.length-1] - validRatios[Math.max(0, validRatios.length-3)];
      const trendCard = el(`
        <div class="card">
          <div class="card-title">Cost Ratio Trend <span style="font-weight:400;font-size:12px;color:var(--grey);">— Actual ÷ Planned each month; rising = drifting over budget</span></div>
          ${chartCanvas(180)}
          <div style="font-size:11.5px;color:var(--grey);margin-top:2px;">${trendDirection > 0.02 ? '<strong style="color:#E2807A;">Rising</strong> over the last few months — cost is drifting ahead of plan.' : trendDirection < -0.02 ? '<strong style="color:#6FCF97;">Falling</strong> — cost efficiency is improving.' : 'Stable — tracking close to plan.'}</div>
        </div>
      `);
      wrap.appendChild(trendCard);
      mountLineChart(trendCard.querySelector('canvas'), 'cost-ratio-trend-'+project.id, monthList.map(m => fmtPeriod(m+'-01')), ratioTrend);
    }
  }

  // ===== Budget Utilization Heatmap — one tile per category, colored by usage % =====
  const heatmapCard = el(`
    <div class="card">
      <div class="card-title">Budget Utilization Heatmap <span style="font-weight:400;font-size:12px;color:var(--grey);">— scan for hot categories at a glance</span></div>
      <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px;">
        ${budgetItems.map(b => {
          const actual = actualFor(b.category);
          const budget = Number(b.budget_amount);
          const usagePct = budget > 0 ? (actual / budget * 100) : 0;
          const color = usagePct > 100 ? '#E2807A' : usagePct >= 85 ? '#D9A441' : '#6FCF97';
          const bg = usagePct > 100 ? 'rgba(226,128,122,0.16)' : usagePct >= 85 ? 'rgba(217,164,65,0.16)' : 'rgba(111,207,151,0.13)';
          return `
            <div style="background:${bg}; box-shadow:inset 0 0 0 1px ${color}44; border-radius:8px; padding:10px 12px;">
              <div style="font-size:10.5px; color:var(--text); margin-bottom:4px; line-height:1.3;">${esc(b.category)}</div>
              <div style="font-size:16px; font-weight:700; color:${color};">${usagePct.toFixed(0)}%</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `);
  wrap.appendChild(heatmapCard);

  // ===== Variance Waterfall — which categories bridge Budget to Actual =====
  const catDeltas = budgetItems.map(b => ({ category: b.category, delta: actualFor(b.category) - Number(b.budget_amount) }))
    .sort((a,b) => Math.abs(b.delta) - Math.abs(a.delta));
  const topDeltas = catDeltas.slice(0, 6);
  const otherDelta = catDeltas.slice(6).reduce((s,d) => s + d.delta, 0);
  if(catDeltas.length > 6) topDeltas.push({ category: 'Other', delta: otherDelta });

  let cum = cogsTotal;
  const waterfallLabels = ['Budget'];
  const waterfallRanges = [[0, cogsTotal]];
  const waterfallColors = ['#5266EB'];
  topDeltas.forEach(d => {
    const from = cum;
    cum += d.delta;
    waterfallLabels.push(d.category);
    waterfallRanges.push([Math.min(from, cum), Math.max(from, cum)]);
    waterfallColors.push(d.delta > 0 ? '#E2807A' : '#6FCF97');
  });
  waterfallLabels.push('Actual');
  waterfallRanges.push([0, totalActual]);
  waterfallColors.push('#5266EB');

  const waterfallCard = el(`
    <div class="card">
      <div class="card-title">Variance Waterfall <span style="font-weight:400;font-size:12px;color:var(--grey);">— which categories bridge Budget to Actual</span></div>
      ${chartCanvas(230)}
    </div>
  `);
  wrap.appendChild(waterfallCard);
  mountWaterfallChart(waterfallCard.querySelector('canvas'), 'waterfall-'+project.id, waterfallLabels, waterfallRanges, waterfallColors);

  // ===== Bar chart: Budget vs Cost vs Final Forecast =====
  const barLabels = ['Original Budget', 'Cost to Date', 'EAC (Forecast)'];
  const barValues = [cogsTotal, totalActual, eac];
  const barColors = ['#6FCF97', '#5266EB', eac > cogsTotal ? '#E2807A' : '#6FCF97'];
  const perfChartCard = el(`
    <div class="card">
      <div class="card-title">Budget vs Cost vs Final Forecast</div>
      ${chartCanvas(190)}
    </div>
  `);
  wrap.appendChild(perfChartCard);
  mountBarChart(perfChartCard.querySelector('canvas'), 'perf-budget-cost-eac-'+project.id, barLabels, barValues, barColors, false);

async function saveCharter(projectId, d){
  const payload = {
    objectives: d.objectives || null,
    scope_in: d.scope_in || null,
    scope_out: d.scope_out || null,
    stakeholders: d.stakeholders || null,
    risks: d.risks || null,
    success_criteria: d.success_criteria || null,
    approved_by: d.approved_by || null,
    approved_date: d.approved_date || null,
  };
  const { error } = await sb.from('projects').update(payload).eq('id', projectId);
  if(error){ alert(error.message); return; }
  await loadProfileAndProjects();
  render();

  const totalContractValue = contractValue + sstAmount;
  const depositAmount = contractValue * (Number(project.deposit_percent)||0) / 100;
  const totalActual = budgetItems.reduce((s,b) => s + actualFor(b.category), 0);
  const totalVariance = cogsTotal - totalActual;

  const grossProfit = contractValue - cogsTotal;
  const taxAmount = grossProfit * (Number(project.tax_percent)||0) / 100;

function downloadProjectCharterPDF(project){
  const html = buildCharterHTML(project, true);
  const printWin = window.open('', '_blank');
  if(!printWin){
    alert('Please allow pop-ups for this site to download the PDF (the browser blocked opening a new window).');
    return;
  }
  printWin.document.write(html);
  printWin.document.close();
  printWin.onload = () => {
    printWin.focus();
    printWin.print();
  };
}

const chartInstances = {};
function destroyChart(id){ if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; } }
function fmtMoneyShort(n){
  const v = Number(n) || 0;
  const abs = Math.abs(v);
  let formatted;
  if(abs >= 1000000) formatted = 'RM ' + (abs/1000000).toFixed(1) + 'M';
  else if(abs >= 1000) formatted = 'RM ' + (abs/1000).toFixed(1) + 'K';
  else formatted = 'RM ' + abs.toFixed(0);
  return v < 0 ? `(${formatted})` : formatted;
}
function getZeroLineGradient(chart, topColor, bottomColor, topAlpha, bottomAlpha){
  const { ctx, chartArea, scales } = chart;
  if(!chartArea) return topColor;
  const zeroPixel = scales.y.getPixelForValue(0);
  const top = chartArea.top, bottom = chartArea.bottom;
  let zeroFrac = (zeroPixel - top) / (bottom - top);
  zeroFrac = Math.max(0, Math.min(1, zeroFrac));
  const gradient = ctx.createLinearGradient(0, top, 0, bottom);
  const hexToRgba = (hex, a) => {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  };
  gradient.addColorStop(0, hexToRgba(topColor, topAlpha));
  gradient.addColorStop(Math.max(0, zeroFrac - 0.0001), hexToRgba(topColor, topAlpha));
  gradient.addColorStop(zeroFrac, hexToRgba(bottomColor, bottomAlpha));
  gradient.addColorStop(1, hexToRgba(bottomColor, bottomAlpha));
  return gradient;
}

    chartInstances[id] = new Chart(canvas.getContext('2d'), {

        data,
        borderColor: (ctx) => getZeroLineGradient(ctx.chart, '#6FCF97', '#E2807A', 1, 1),

        fill: true, tension: 0.3, pointRadius: 2,

function ForecastView(project){
  const wrap = el(`<div></div>`);
  const cashItems = state.lineItems.filter(i => i.statement_type === 'cashflow');
  const openingBalance = Number(project.opening_balance) || 0;

  const totalActual = cashItems.filter(i=>i.status==='actual').reduce((s,i)=>s+Number(i.amount),0);
  const totalForecast = cashItems.filter(i=>i.status==='forecast').reduce((s,i)=>s+Number(i.amount),0);
  const currentPosition = openingBalance + totalActual;
  const projectedPosition = currentPosition + totalForecast;

  wrap.appendChild(el(`
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Opening balance</div>
        <div class="stat-value">${fmtMoney(openingBalance)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Current position (Actuals)</div>
        <div class="stat-value ${currentPosition>=0?'pos':'neg'}">${fmtMoney(currentPosition)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Projected position (+ Forecast)</div>
        <div class="stat-value ${projectedPosition>=0?'pos':'neg'}">${fmtMoney(projectedPosition)}</div>
      </div>
    </div>
  `));

  const dated = cashItems.filter(i => i.period);
  const undated = cashItems.filter(i => !i.period);

  if(dated.length === 0){
    wrap.appendChild(el(`<div class="empty-state"><div class="big">No dated cashflow items yet</div><div>Add cashflow line items with a Month set (Actual or Forecast) to build a projection.</div></div>`));
    return wrap;
  }

  const byMonth = {};
  dated.forEach(i => {
    const m = i.period.slice(0,7);
    if(!byMonth[m]) byMonth[m] = { actual: 0, forecast: 0 };
    if(i.status === 'forecast') byMonth[m].forecast += Number(i.amount);
    else byMonth[m].actual += Number(i.amount);
  });
  const months = Object.keys(byMonth).sort();

  let running = openingBalance;
  const balanceTrend = [];
  const monthLabels = [];
  let rowsHtml = '';
  months.forEach(m => {
    const { actual, forecast } = byMonth[m];
    const net = actual + forecast;
    running += net;
    balanceTrend.push(running);
    monthLabels.push(fmtPeriod(m+'-01'));
    const isForecastMonth = forecast !== 0;
    rowsHtml += `<tr>
      <td class="cat">${fmtPeriod(m+'-01')} ${isForecastMonth ? '<span class="pill forecast">Forecast</span>' : ''}</td>
      <td class="num ${actual>=0?'amt-pos':'amt-neg'}">${actual !== 0 ? fmtMoney(actual) : '—'}</td>
      <td class="num ${forecast>=0?'amt-pos':'amt-neg'}">${forecast !== 0 ? fmtMoney(forecast) : '—'}</td>
      <td class="num ${net>=0?'amt-pos':'amt-neg'}">${fmtMoney(net)}</td>
      <td class="num ${running>=0?'amt-pos':'amt-neg'}" style="font-weight:600;">${fmtMoney(running)}</td>
    </tr>`;
  });

  const chartId = 'forecast-' + (project._consolidated ? 'consolidated' : (project.id || 'p'));
  const trendCard = el(`
    <div class="card">
      <div class="card-title">Cash balance trajectory <span style="font-weight:400;font-size:12px;color:var(--grey);">— where the balance is headed, month by month</span></div>
      ${chartCanvas(200)}
    </div>
  `);
  wrap.appendChild(trendCard);
  mountLineChart(trendCard.querySelector('canvas'), chartId, monthLabels, balanceTrend);

  const card = el(`
    <div class="card">
      <div class="card-title">Monthly cash projection</div>
      <table class="ledger">
        <thead><tr><th>Month</th><th class="num">Actual</th><th class="num">Forecast</th><th class="num">Net</th><th class="num">Running Balance</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `);
  wrap.appendChild(card);

  if(undated.length > 0){
    const undatedNet = undated.reduce((s,i)=>s+Number(i.amount),0);
    wrap.appendChild(el(`
      <div class="card">
        <div class="card-title">Not included in projection</div>
        <div style="font-size:13px;color:var(--grey);">${undated.length} cashflow item(s) with no Month set — total ${fmtMoney(undatedNet)}. Set a Month on these to include them in the timeline above.</div>
      </div>
    `));
  }

  return wrap;
}

async function fixCashflowStructure(){
  const candidates = state.lineItems.filter(i => i.statement_type === 'cashflow' && i.subcategory);
  if(candidates.length === 0){
    alert('No Cashflow items with a Subcategory found in this project — nothing to fix.');
    return;
  }
  askConfirm({
    title: 'Fix Cashflow structure?',
    message: `This will swap Category ⇄ Subcategory for <strong>${candidates.length}</strong> Cashflow item(s) in this project — turning "Cash-In/Cash-Out" into the Category and the specific item into the Subcategory. This cannot be undone automatically.`,
    confirmLabel: 'Swap now',
    danger: true,
    onConfirm: async () => {
      for(const item of candidates){
        await sb.from('line_items').update({
          category: item.subcategory,
          subcategory: item.category,
        }).eq('id', item.id);
      }
      await loadProjectData(state.selectedProjectId);
      render();
    }
  });
}

function getConsolidatedVirtualProject(){
  const totalOpeningBalance = state.projects.reduce((s,p) => s + (Number(p.opening_balance) || 0), 0);
  return { opening_balance: totalOpeningBalance, percent_complete: 0, start_date: null, end_date: null, _consolidated: true };
}

function buildConsolidatedStatementView(statementType, label){
  const wrap = el(`<div></div>`);
  const items = state.lineItems.filter(i => i.statement_type === statementType);
  const total = items.reduce((s,i) => s + Number(i.amount), 0);
  const projectCount = new Set(items.map(i => i.project_id)).size;

  // ===== 1. Headline — the single number that answers "how are we doing?" =====
  wrap.appendChild(el(`
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total Net ${label}</div>
        <div class="stat-value ${total>=0?'pos':'neg'}" style="font-size:28px;">${fmtMoney(total)}</div>
      </div>
      <div class="stat-card"><div class="stat-label">Projects with data</div><div class="stat-value">${projectCount}</div></div>
      <div class="stat-card"><div class="stat-label">Line items</div><div class="stat-value">${items.length}</div></div>
    </div>
  `));

  if(items.length === 0){
    wrap.appendChild(el(`<div class="empty-state"><div class="big">No ${label} data yet</div><div>Upload or add ${label} line items in a project to see the portfolio view here.</div></div>`));
    return wrap;
  }

  // ===== 2. Trend — how did we get to that number, over time? =====
  const dated = items.filter(i => i.period);
  if(dated.length > 0){
    const byMonth = {};
    dated.forEach(i => { const m = i.period.slice(0,7); byMonth[m] = (byMonth[m]||0) + Number(i.amount); });
    const months = Object.keys(byMonth).sort();
    const trendCard = el(`
      <div class="card">
        <div class="card-title">${label} trend <span style="font-weight:400;font-size:12px;color:var(--grey);">— monthly, across all projects</span></div>
        ${chartCanvas(190)}
      </div>
    `);
    wrap.appendChild(trendCard);
    mountLineChart(
      trendCard.querySelector('canvas'), 'consol-trend-'+statementType,
      months.map(m => fmtPeriod(m+'-01')), months.map(m => byMonth[m])
    );
  }

  // ===== 3. Comparison — which projects are driving that trend? =====
  const byProject = {};
  items.forEach(i => { const pname = i.projects?.name || 'Unknown'; byProject[pname] = (byProject[pname]||0) + Number(i.amount); });
  const projectRows = Object.entries(byProject).sort((a,b) => b[1]-a[1]);
  const compareCard = el(`
    <div class="card">
      <div class="card-title">${label} by project <span style="font-weight:400;font-size:12px;color:var(--grey);">— who's carrying the portfolio</span></div>
      ${chartCanvas(Math.max(120, projectRows.length * 38))}
    </div>
  `);
  wrap.appendChild(compareCard);
  mountBarChart(
    compareCard.querySelector('canvas'), 'consol-byproj-'+statementType,
    projectRows.map(([n]) => n), projectRows.map(([,v]) => v),
    projectRows.map(([,v]) => v >= 0 ? '#6FCF97' : '#E2807A'), true
  );

  // ===== 4. Detail — full transparency, List or Grid =====
  const detailHeader = el(`
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div class="card-title" style="margin:0;">Detail</div>
      <div style="display:flex; border:1px solid var(--line); border-radius:5px; overflow:hidden;">
        <button type="button" id="consol-view-list" class="btn pill small ${state.viewMode==='list'?'':'secondary'}" style="border:none; border-radius:0;">List</button>
        <button type="button" id="consol-view-grid" class="btn pill small ${state.viewMode==='grid'?'':'secondary'}" style="border:none; border-radius:0;">Grid</button>
      </div>
    </div>
  `);
  detailHeader.querySelector('#consol-view-list').addEventListener('click', () => { state.viewMode = 'list'; render(); });
  detailHeader.querySelector('#consol-view-grid').addEventListener('click', () => { state.viewMode = 'grid'; render(); });
  wrap.appendChild(detailHeader);

  wrap.appendChild(
    state.viewMode === 'grid'
      ? MatrixGridView(items, statementType, statementType === 'cashflow' ? getConsolidatedVirtualProject() : undefined)
      : StatementTable(items, statementType)
  );

  return wrap;
}

function ConsolidatedAnalysisView(){
  const wrap = el(`<div></div>`);

  // Portfolio-wide alerts: run the same rule-based check per project, tag each with its project name
  const portfolioAlerts = [];
  state.projects.forEach(p => {
    const projItems = state.lineItems.filter(i => i.project_id === p.id);
    const projBudget = (state.budgetItems || []).filter(b => b.project_id === p.id);
    const projAlerts = computeAlerts(p, projItems, projBudget);
    projAlerts.forEach(a => portfolioAlerts.push({ ...a, projectName: p.name }));
  });
  const order = { critical: 0, warning: 1 };
  portfolioAlerts.sort((a,b) => order[a.severity] - order[b.severity]);
  const criticalCount = portfolioAlerts.filter(a => a.severity === 'critical').length;
  const warningCount = portfolioAlerts.filter(a => a.severity === 'warning').length;

  // Portfolio cost performance rollup
  const allBudgetItems = state.budgetItems || [];
  const cogsTotal = allBudgetItems.reduce((s,b) => s + Number(b.budget_amount), 0);
  const totalActual = allBudgetItems.reduce((s,b) => {
    const catLower = b.category.trim().toLowerCase();
    const actual = state.lineItems
      .filter(i => {
        if(i.project_id !== b.project_id) return false;
        if(i.statement_type !== 'pnl') return false;
        const cat = (i.category || '').trim().toLowerCase();
        const sub = (i.subcategory || '').trim().toLowerCase();
        return cat === catLower || sub === catLower;
      })
      .reduce((sum,i) => sum + Math.abs(Number(i.amount)), 0);
    return s + actual;
  }, 0);
  const variance = cogsTotal - totalActual;

  wrap.appendChild(el(`
    <div class="stat-grid">
      <div class="stat-card" style="background:${criticalCount>0 ? 'var(--rust-soft)' : 'var(--teal-soft)'};">
        <div class="stat-label">Critical Alerts</div>
        <div class="stat-value" style="color:${criticalCount>0 ? 'var(--rust)' : 'var(--teal)'};">${criticalCount}</div>
      </div>
      <div class="stat-card" style="background:${warningCount>0 ? 'var(--gold-soft)' : 'var(--teal-soft)'};">
        <div class="stat-label">Warning Alerts</div>
        <div class="stat-value" style="color:${warningCount>0 ? 'var(--gold)' : 'var(--teal)'};">${warningCount}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Budget (all projects)</div>
        <div class="stat-value">${fmtMoney(cogsTotal)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Actual</div>
        <div class="stat-value">${fmtMoney(totalActual)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Variance</div>
        <div class="stat-value ${variance>=0?'pos':'neg'}">${fmtMoney(variance)}</div>
      </div>
    </div>
  `));

  // ===== Budget vs Actual by project — visual comparison before the alert detail =====
  const budgetByProject = {}, actualByProject = {};
  state.projects.forEach(p => {
    const projBudget = allBudgetItems.filter(b => b.project_id === p.id);
    budgetByProject[p.name] = projBudget.reduce((s,b) => s + Number(b.budget_amount), 0);
    actualByProject[p.name] = projBudget.reduce((s,b) => {
      const catLower = b.category.trim().toLowerCase();
      return s + state.lineItems
        .filter(i => {
          if(i.project_id !== p.id || i.statement_type !== 'pnl') return false;
          const cat = (i.category || '').trim().toLowerCase();
          const sub = (i.subcategory || '').trim().toLowerCase();
          return cat === catLower || sub === catLower;
        })
        .reduce((sum,i) => sum + Math.abs(Number(i.amount)), 0);
    }, 0);
  });
  const projNames = state.projects.filter(p => budgetByProject[p.name] > 0).map(p => p.name);
  if(projNames.length > 0){
    const budgetChartCard = el(`
      <div class="card">
        <div class="card-title">Budget vs Actual by project <span style="font-weight:400;font-size:12px;color:var(--grey);">— where is spend tracking against plan</span></div>
        ${chartCanvas(220)}
      </div>
    `);
    wrap.appendChild(budgetChartCard);
    mountGroupedBarChart(budgetChartCard.querySelector('canvas'), 'consol-budget-vs-actual', projNames, [
      { label: 'Budget', data: projNames.map(n => budgetByProject[n]), backgroundColor: '#5266EB', borderRadius: 4 },
      { label: 'Actual', data: projNames.map(n => actualByProject[n]), backgroundColor: '#6FCF97', borderRadius: 4 },
    ]);
  }

  const alertsCard = el(`<div class="card"><div class="card-title">Alerts across all projects</div></div>`);
  if(portfolioAlerts.length === 0){
    alertsCard.appendChild(el(`<div style="font-size:13px; color:var(--grey);">No issues detected in any project.</div>`));
  } else {
    const list = el(`<div style="display:flex; flex-direction:column; gap:10px;"></div>`);
    portfolioAlerts.forEach(a => {
      const isCritical = a.severity === 'critical';
      const color = isCritical ? 'var(--rust)' : 'var(--gold)';
      const bg = isCritical ? 'var(--rust-soft)' : 'var(--gold-soft)';
      list.appendChild(el(`
        <div style="border-left:4px solid ${color}; background:${bg}; border-radius:6px; padding:12px 14px;">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;">
            <span style="font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:${color};">${a.severity}</span>
            <span style="font-size:12px; font-weight:600; color:var(--grey);">${esc(a.projectName)}</span>
            <span style="font-size:14px; font-weight:600;">${a.title}</span>
          </div>
          <div style="font-size:13px; color:var(--grey);">${a.detail}</div>
        </div>
      `));
    });
    alertsCard.appendChild(list);
  }
  wrap.appendChild(alertsCard);

  return wrap;
}

      <div class="field">
        <label>CSV / Excel file</label>
        <div class="file-drop ${state.uploadFile?'has-file':''}" id="file-drop">
          ${state.uploadFile ? state.uploadFile.name : 'Click to select a file (.csv, .xlsx)'}

    modal.querySelector('#file-input').addEventListener('change', (e) => {
      if(e.target.files[0]) handleFileSelect(e.target.files[0]);
    });
    modal.querySelector('#up-cancel').addEventListener('click', () => { closeUploadModal(); render(); });
  }

  if(state.uploadStep === 'mismatch'){
    modal.style.width = '460px';
    modal.innerHTML = `
      <h3 class="modal-title">Format not recognized</h3>
      <div class="page-sub" style="margin-bottom:14px;">
        <strong>${state.uploadFile ? state.uploadFile.name : 'This file'}</strong> doesn't match either of PROFIT's upload templates. To keep data consistent, uploads should use one of the standard templates rather than a custom format.
      </div>
      <div class="field" style="background:var(--paper-dim); padding:12px 14px; border-radius:6px; font-size:13px; margin-bottom:16px;">
        <strong>Expected one of:</strong>
        <ul style="margin:8px 0 0; padding-left:18px; line-height:1.7;">
          <li>Flat template — headers exactly: <code>Category, Subcategory, Amount</code></li>
          <li>Monthly template — headers: <code>Type, Category, Jan...Dec, Total</code></li>
        </ul>
      </div>
      <div class="modal-actions" style="justify-content:space-between;">
        <button type="button" class="btn pill secondary" id="mm-map-anyway" style="font-size:12px;">Map columns manually anyway</button>
        <button type="button" class="btn pill" id="mm-cancel">Got it, I'll re-upload</button>
      </div>
    `;
    modal.querySelector('#mm-cancel').addEventListener('click', () => { closeUploadModal(); render(); });
    modal.querySelector('#mm-map-anyway').addEventListener('click', () => {
      state.uploadHeaderRowIndex = guessHeaderRow(state.uploadRawRows);
      state.uploadStep = 2;
      render();
    });
  }

  if(state.uploadStep === 2){
    const rows = state.uploadRawRows.slice(0, 15);
    const maxCols = 8;
    modal.style.width = '600px';
    modal.innerHTML = `
      <h3 class="modal-title">Select header row</h3>
      <div class="page-sub" style="margin-bottom:12px;">Click the row that contains the actual column names (e.g. Category, Amount). Rows above it will be ignored.</div>

      <div style="overflow-x:auto; border:1px solid var(--line); border-radius:6px; max-height:340px; overflow-y:auto;">
        <table style="border-collapse:collapse; font-size:11.5px; width:100%;">
          <tbody>
            ${rows.map((row, idx) => `
              <tr class="header-row-option" data-idx="${idx}" style="cursor:pointer; ${state.uploadHeaderRowIndex===idx ? 'background:var(--teal-soft);' : ''}">
                <td style="padding:5px 8px; color:var(--grey); border-right:1px solid var(--line); font-family:'Lexend',sans-serif; font-variant-numeric:tabular-nums;">${idx+1}${state.uploadHeaderRowIndex===idx ? ' ✓' : ''}</td>
                ${row.slice(0,maxCols).map(cell => `<td style="padding:5px 8px; border-bottom:1px solid var(--paper-dim); white-space:nowrap; max-width:110px; overflow:hidden; text-overflow:ellipsis;">${(cell===undefined||String(cell).trim()==='')?'<span style="color:#ccc;">—</span>':String(cell)}</td>`).join('')}
                ${row.length > maxCols ? `<td style="padding:5px 8px; color:var(--grey);">+${row.length-maxCols} more</td>` : ''}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn pill secondary" id="up-back">Back</button>
        <button type="button" class="btn pill" id="up-next">Next</button>
      </div>
    `;
    modal.querySelectorAll('.header-row-option').forEach(r => r.addEventListener('click', () => {
      state.uploadHeaderRowIndex = parseInt(r.dataset.idx);
      render();
    }));
    modal.querySelector('#up-back').addEventListener('click', () => {
      state.uploadStep = 1;
      state.uploadFile = null;
      state.uploadRawRows = [];
      render();
    });
    modal.querySelector('#up-next').addEventListener('click', () => {
      buildHeadersAndRows();
      state.uploadStep = 3;
      render();
    });
  }

  if(state.uploadStep === 3){
    const headers = state.uploadFileHeaders;
    const opts = (selected) => `<option value="">—</option>` + headers.map(h => `<option value="${h}" ${h===selected?'selected':''}>${h}</option>`).join('');
    modal.innerHTML = `
      <h3 class="modal-title">Map columns</h3>
      ${state.uploadTemplateDetected ? `<div class="info-msg">✓ Template detected automatically — columns are already mapped. Review & click Import.</div>` : ''}
      <div class="page-sub" style="margin-bottom:14px;">${state.uploadFileRows.length} rows detected (after header row)</div>
      <div class="field"><label>Category (required)</label><select id="map-category">${opts(state.uploadMapping.category)}</select></div>
      <div class="field"><label>Subcategory (optional)</label><select id="map-subcategory">${opts(state.uploadMapping.subcategory)}</select></div>
      <div class="field"><label>Month (required)</label><select id="map-period">${opts(state.uploadMapping.period)}</select></div>
      <div class="field"><label>Amount (required)</label><select id="map-amount">${opts(state.uploadMapping.amount)}</select></div>
      <div class="field">
        <label>Skip rows if Category contains (comma-separated)</label>
        <input type="text" id="exclude-keywords" value="${state.uploadExcludeKeywords}">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn pill secondary" id="up-back">Back</button>
        <button type="button" class="btn pill" id="up-confirm">Import</button>
      </div>
    `;
    modal.querySelector('#map-category').addEventListener('change', (e) => state.uploadMapping.category = e.target.value);
    modal.querySelector('#map-subcategory').addEventListener('change', (e) => state.uploadMapping.subcategory = e.target.value);
    modal.querySelector('#map-period').addEventListener('change', (e) => state.uploadMapping.period = e.target.value);
    modal.querySelector('#map-amount').addEventListener('change', (e) => state.uploadMapping.amount = e.target.value);
    modal.querySelector('#exclude-keywords').addEventListener('input', (e) => state.uploadExcludeKeywords = e.target.value);
    modal.querySelector('#up-back').addEventListener('click', () => { state.uploadStep = 2; render(); });
    modal.querySelector('#up-confirm').addEventListener('click', confirmUpload);
  }

  return overlay;
}

function QuickEditModal(){
  const type = state.quickEditType;
  const combos = [...new Set(
    state.lineItems.map(i => `${i.category}|||${i.subcategory || ''}`)
  )].sort();

  if(combos.length === 0){
    const overlay = el(`
      <div class="modal-overlay">
        <div class="modal">
          <h3 class="modal-title">Quick edit months</h3>
          <div style="font-size:13px;color:var(--grey);">No existing line items yet — Quick Edit works on data that's already there. Use "+ Add line item" or "+ Quick fill months" to create some first.</div>
          <div class="modal-actions"><button type="button" class="btn pill" id="qe-close">Close</button></div>
        </div>
      </div>
    `);
    overlay.querySelector('#qe-close').addEventListener('click', closeQuickEditModal);
    return overlay;
  }

  const comboValue = `${state.quickEditCategory}|||${state.quickEditSubcategory}`;
  const comboLabel = (c) => { const [cat, sub] = c.split('|||'); return sub ? `${cat} — ${sub}` : cat; };

  const years = [...new Set(state.lineItems.filter(i => i.period).map(i => i.period.slice(0,4)))].sort();
  if(!years.includes(String(state.quickEditYear))) years.push(String(state.quickEditYear));
  years.sort();

  const months = Array.from({length:12}, (_, m) => `${state.quickEditYear}-${String(m+1).padStart(2,'0')}`);
  const existingForCombo = state.lineItems.filter(i =>
    i.statement_type === type && i.category === state.quickEditCategory && (i.subcategory || '') === state.quickEditSubcategory
  );
  const byMonth = {};
  existingForCombo.forEach(i => { if(i.period) byMonth[i.period.slice(0,7)] = i; });

  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal" style="width:460px;">
        <h3 class="modal-title">Quick edit months — ${type === 'pnl' ? 'PnL' : 'Cashflow'}</h3>
        <div class="page-sub" style="margin-bottom:14px;">Pick a category, then edit any month below — existing values are pre-filled. Clear a value to delete that month's entry.</div>

        <div class="field">
          <label>Category — Subcategory</label>
          <select id="qe-combo">
            ${combos.map(c => `<option value="${esc(c)}" ${c===comboValue?'selected':''}>${esc(comboLabel(c))}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Year</label>
          <select id="qe-year">
            ${years.map(y => `<option value="${y}" ${Number(y)===state.quickEditYear?'selected':''}>${y}</option>`).join('')}
          </select>
        </div>

        <div style="max-height:340px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-top:6px;">
          ${months.map(m => {
            const row = byMonth[m];
            return `
            <div style="display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--paper-dim);">
              <label style="font-size:13px; font-weight:500; color:var(--text); text-transform:none; letter-spacing:normal; width:80px; flex-shrink:0;">${fmtPeriod(m+'-01')}</label>
              <input type="number" step="0.01" class="qe-month-input" data-month="${m}" style="flex:1;" placeholder="—" value="${row ? row.amount : ''}">
              <select class="qe-month-status" data-month="${m}" style="width:100px; flex-shrink:0;">
                <option value="actual" ${!row || row.status!=='forecast' ? 'selected' : ''}>Actual</option>
                <option value="forecast" ${row && row.status==='forecast' ? 'selected' : ''}>Forecast</option>
              </select>
            </div>
          `;}).join('')}
        </div>

        <div class="modal-actions">
          <button type="button" class="btn pill secondary" id="qe-cancel">Cancel</button>
          <button type="button" class="btn pill" id="qe-save">Save changes</button>
        </div>
      </div>
    </div>
  `);

  overlay.querySelector('#qe-combo').addEventListener('change', (e) => {
    const [cat, sub] = e.target.value.split('|||');
    state.quickEditCategory = cat;
    state.quickEditSubcategory = sub;
    render();
  });
  overlay.querySelector('#qe-year').addEventListener('change', (e) => {
    state.quickEditYear = Number(e.target.value);
    render();
  });
  overlay.querySelector('#qe-cancel').addEventListener('click', closeQuickEditModal);
  overlay.querySelector('#qe-save').addEventListener('click', () => {
    const monthValues = {};
    overlay.querySelectorAll('.qe-month-input').forEach(inp => {
      const month = inp.dataset.month;
      const statusEl = overlay.querySelector(`.qe-month-status[data-month="${month}"]`);
      const v = inp.value.trim();
      if(v === ''){
        monthValues[month] = { amount: null, status: statusEl.value };
      } else {
        const amt = parseFloat(v);
        if(isNaN(amt)) return;
        monthValues[month] = { amount: amt, status: statusEl.value };
      }
    });
    saveQuickEdit(monthValues);
  });

  return overlay;
}

function QuickFillModal(){
  const type = state.quickFillType;
  const draft = state.quickFillDraft;

  const existingCategories = [...new Set(
    state.lineItems.map(i => i.category)
  )].sort();
  const existingSubcategories = [...new Set([
    ...STANDARD_SUBCATEGORIES,
    ...state.lineItems.filter(i => i.subcategory).map(i => i.subcategory)
  ])].sort();

  const year = new Date().getFullYear();
  const months = Array.from({length:12}, (_, m) => `${year}-${String(m+1).padStart(2,'0')}`);
  const draftMonths = (draft && draft.months) || {};

  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal" style="width:460px;">
        <h3 class="modal-title">Quick fill months — ${type === 'pnl' ? 'PnL' : 'Cashflow'}</h3>
        ${state.draftRestoredBanner ? `<div class="info-msg">We restored your unsaved entries from before the page reloaded.</div>` : ''}
        <div class="page-sub" style="margin-bottom:14px;">Set the Category once, then enter an amount per month below. Blank months are skipped.</div>

        <div class="field">
          <label>Category (required)</label>
          <select id="qf-category-quickpick" style="margin-bottom:6px;">
            <option value="">— Quick pick existing category —</option>
            ${existingCategories.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
          </select>
          <input type="text" id="qf-category-input" placeholder="Or type a new category name" value="${draft ? draft.category || '' : ''}" required>
        </div>

        <div class="field">
          <label>Subcategory (optional)</label>
          <select id="qf-subcategory-quickpick" style="margin-bottom:6px;">
            <option value="">— Quick pick existing subcategory —</option>
            ${existingSubcategories.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}
          </select>
          <input type="text" id="qf-subcategory-input" placeholder="Or type a new subcategory name" value="${draft ? draft.subcategory || '' : ''}">
        </div>

        <div class="field">
          <label>Status</label>
          <select id="qf-status">
            <option value="actual" ${draft && draft.status==='forecast' ? '' : 'selected'}>Actual — already happened</option>
            <option value="forecast" ${draft && draft.status==='forecast' ? 'selected' : ''}>Forecast — expected in future</option>
          </select>
        </div>

        <div class="field-row" style="align-items:end;">
          <div class="field" style="margin-bottom:0;">
            <label>Fill amount (${year})</label>
            <input type="number" step="0.01" id="qf-fill-amount" placeholder="e.g. -4500">
          </div>
          <button type="button" class="btn pill small secondary" id="qf-apply-all" style="margin-bottom:14px;">Apply to all 12</button>
        </div>

        <div style="max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-top:6px;">
          ${months.map(m => `
            <div style="display:flex; align-items:center; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--paper-dim);">
              <label style="font-size:13px; font-weight:500; color:var(--text); text-transform:none; letter-spacing:normal;">${fmtPeriod(m+'-01')}</label>
              <input type="number" step="0.01" class="qf-month-input" data-month="${m}" style="width:140px;" placeholder="—" value="${draftMonths[m] !== undefined ? draftMonths[m] : ''}">
            </div>
          `).join('')}
        </div>

        <div class="modal-actions">
          <button type="button" class="btn pill secondary" id="qf-cancel">Cancel</button>
          <button type="button" class="btn pill" id="qf-submit">Create entries</button>
        </div>
      </div>
    </div>
  `);

  const catQuickpick = overlay.querySelector('#qf-category-quickpick');
  const catInput = overlay.querySelector('#qf-category-input');
  catQuickpick.addEventListener('change', () => { if(catQuickpick.value) catInput.value = catQuickpick.value; saveQuickFillDraft(overlay, type); });

  const subQuickpick = overlay.querySelector('#qf-subcategory-quickpick');
  const subInput = overlay.querySelector('#qf-subcategory-input');
  subQuickpick.addEventListener('change', () => { if(subQuickpick.value) subInput.value = subQuickpick.value; saveQuickFillDraft(overlay, type); });

  overlay.querySelector('#qf-apply-all').addEventListener('click', () => {
    const fillVal = overlay.querySelector('#qf-fill-amount').value;
    overlay.querySelectorAll('.qf-month-input').forEach(inp => { inp.value = fillVal; });
    saveQuickFillDraft(overlay, type);
  });

  overlay.addEventListener('input', () => saveQuickFillDraft(overlay, type));

  overlay.querySelector('#qf-cancel').addEventListener('click', () => {
    clearDraft('profit_draft_quickfill');
    state.draftRestoredBanner = false;
    closeQuickFillModal();
  });

  overlay.querySelector('#qf-submit').addEventListener('click', () => {
    const category = catInput.value.trim();
    const subcategory = subInput.value.trim();
    const status = overlay.querySelector('#qf-status').value;
    if(!category){ alert('Please enter a Category.'); return; }

    const items = [];
    overlay.querySelectorAll('.qf-month-input').forEach(inp => {
      const v = inp.value.trim();
      if(v === '') return;
      const amount = parseFloat(v);
      if(isNaN(amount) || amount === 0) return;
      items.push({
        project_id: state.selectedProjectId,
        statement_type: type,
        category,
        subcategory: subcategory || null,
        amount,
        period: `${inp.dataset.month}-01`,
        status,
        created_by: state.profile.id,
      });
    });

    askConfirm({
      title: 'Create entries?',
      message: `This will create <strong>${items.length}</strong> line item(s) for <strong>${esc(category)}</strong>.`,
      confirmLabel: 'Create',
      danger: false,
      onConfirm: () => submitQuickFill(items)
    });
  });

  return overlay;
}

function saveQuickFillDraft(overlay, type){
  const months = {};
  overlay.querySelectorAll('.qf-month-input').forEach(inp => {
    if(inp.value.trim() !== '') months[inp.dataset.month] = inp.value;
  });
  const liveData = {
    category: overlay.querySelector('#qf-category-input').value,
    subcategory: overlay.querySelector('#qf-subcategory-input').value,
    status: overlay.querySelector('#qf-status').value,
    months,
  };
  // Keep in-memory state in sync (not just localStorage) so that if anything else
  // triggers a re-render while the user is still typing, the modal rebuilds with
  // what they've typed so far, instead of reverting to stale/blank values.
  state.quickFillDraft = liveData;
  saveDraft('profit_draft_quickfill', {
    type,
    selectedProjectId: state.selectedProjectId,
    data: liveData
  });
}

          <div class="field-row">
            <div class="field"><label>Amount (RM) — negative for outflow/expense</label><input type="number" step="0.01" name="amount" value="${d.amount}" placeholder="e.g. -4500 or 15000" required></div>
            <div class="field"><label>Month (required)</label><input type="month" name="period" value="${d.period}" required></div>
          </div>
          <div class="field">
            <label>Status</label>
            <select name="status">
              <option value="actual" ${d.status==='actual'?'selected':''}>Actual — already happened</option>
              <option value="forecast" ${d.status==='forecast'?'selected':''}>Forecast — expected in future</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn pill secondary" id="li-cancel">Cancel</button>
            <button type="submit" class="btn pill">${isEdit ? 'Save' : 'Add'}</button>
          </div>
        </form>
      </div>
    </div>
  `);
  const quickpick = overlay.querySelector('#category-quickpick');
  const categoryInput = overlay.querySelector('#category-input');
  if(existingCategories.includes(d.category)) quickpick.value = d.category;
  quickpick.addEventListener('change', () => {
    if(quickpick.value) categoryInput.value = quickpick.value;
  });

  const subQuickpick = overlay.querySelector('#subcategory-quickpick');
  const subInput = overlay.querySelector('#subcategory-input');
  if(existingSubcategories.includes(d.subcategory)) subQuickpick.value = d.subcategory;
  subQuickpick.addEventListener('change', () => {
    if(subQuickpick.value) subInput.value = subQuickpick.value;
  });

  overlay.querySelector('#li-cancel').addEventListener('click', () => { clearDraft('profit_draft_lineitem'); state.draftRestoredBanner = false; closeLineItemModal(); render(); });

  const liForm = overlay.querySelector('#li-form');
  liForm.addEventListener('input', () => {
    const fd = new FormData(liForm);
    const liveData = {
      id: d.id,
      category: fd.get('category') || '',
      subcategory: fd.get('subcategory') || '',
      amount: fd.get('amount') || '',
      period: fd.get('period') || '',
      status: fd.get('status') || 'actual',
    };
    // Keep in-memory state in sync (not just localStorage) so that if anything else
    // triggers a re-render while the user is still typing, the modal rebuilds with
    // what they've typed so far, instead of reverting to stale values.
    state.lineItemModalData = liveData;
    saveDraft('profit_draft_lineitem', {
      mode: state.lineItemModalMode,
      type: state.lineItemModalType,
      selectedProjectId: state.selectedProjectId,
      data: liveData
    });
  });

  overlay.querySelector('#li-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    state.lineItemModalData = {
      ...state.lineItemModalData,
      category: fd.get('category'),
      subcategory: fd.get('subcategory'),
      amount: fd.get('amount'),
      period: fd.get('period'),
      status: fd.get('status'),
    };
    if(isEdit){
      state.showLineItemModal = false;
      askConfirm({
        title: 'Save changes?',
        message: `Confirm changes to <strong>${esc(state.lineItemModalData.category)}</strong> (${fmtMoney(parseFloat(state.lineItemModalData.amount) || 0)}).`,
        confirmLabel: 'Save changes',
        danger: false,
        onConfirm: () => saveLineItem()
      });
    } else {
      saveLineItem();
    }
  });
  return overlay;
}

init();
</script>
</body>
</html>
